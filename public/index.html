// クラウド保存用ドキュメント（暗号化作品は enc に暗号文。鍵が無ければ null＝同期しない＝平文漏れ防止）
async function cloudDoc(id){
  const p = state.projects.find(x=>x.id===id); if(!p) return null;
  const data = state.data[id] || emptyProjectData();
  // 原稿の本文は章ごとに別ドキュメント(chapters)に保存 → 作品本体には目次(id/title)だけ入れて1MB上限を回避
  const ms = data.manuscript || {chapters:[]};
  const slim = { ...data, manuscript:{ chapters:(ms.chapters||[]).map(c=>({id:c.id,title:c.title})) } };
  const base = { title:p.title, createdAt:p.createdAt||Date.now() };
  let out;
  if(p.encrypted){ const key=await getKey(id); if(!key) return null;
    out = { ...base, encrypted:true, enc: await encObj(slim, key) }; }
  else out = { ...base, data: slim };
  if(p.shared){ out.ownerUid = p.ownerUid || (fbUser&&fbUser.uid) || null; out.members = p.members || (fbUser?[fbUser.uid]:[]); out.inviteOpen = p.inviteOpen!==false; }
  return out;
}
async function cloudChapter(id, ch){   // 章ドキュメント（暗号化作品は暗号文）
  const p = state.projects.find(x=>x.id===id);
  if(p && p.encrypted){ const key=await getKey(id); if(!key) return null;
    return { encrypted:true, enc: await encObj({ title:ch.title||"", body:ch.body||"" }, key) }; }
  return { title:ch.title||"", body:ch.body||"" };
}
// ロック中作品の復号（localStorage形式=__enc / cloud形式=enc＋章enc の両対応）
async function decryptLocked(id, key){
  const L=_locked[id];
  if(L.__enc) return await decObj(L.__enc, key);
  const data=await decObj(L.enc, key);
  if(!data.manuscript) data.manuscript={chapters:[]};
  for(const ch of (data.manuscript.chapters||[])){
    const ce=L.chEnc && L.chEnc[ch.id];
    if(ce){ try{ const cb=await decObj(ce, key); ch.body=cb.body||""; if(cb.title) ch.title=cb.title; }catch(e){ ch.body=ch.body||""; } }
    else ch.body=ch.body||"";
  }
  return data;
}
function projectsCol(){ return fbDb.collection("users").doc(fbUser.uid).collection("projects"); }
function projForId(id){ return (state.projects||[]).find(x=>x.id===id); }
// 保存先：共有作品は works/{id}、非共有は users/{uid}/projects/{id}（state.projects を外れた id は private 扱い）
function worksCol(){ return fbDb.collection("works"); }
function workRef(id){ const p=projForId(id); return (p&&p.shared) ? worksCol().doc(id) : projectsCol().doc(id); }
function chapCol(id){ return workRef(id).collection("chapters"); }

async function pullFromCloud(){
  if(!fbUser||!fbDb) return;
  const remote = {};   // id -> doc data（＋ _shared フラグ）
  // 自分の非共有作品
  const privSnap = await projectsCol().get();
  privSnap.forEach(d=> remote[d.id]={ ...d.data(), _shared:false });
  // 自分がメンバーの共有作品
  try{
    const shareSnap = await worksCol().where("members","array-contains",fbUser.uid).get();
    shareSnap.forEach(d=> remote[d.id]={ ...d.data(), _shared:true });
  }catch(e){ console.warn("[Fabula] 共有作品取得失敗:", e); }
  // 初回ログイン: この端末にしか無い「非共有」作品はクラウドへ退避（本体＋各章）
  for(const p of [...state.projects]){
    if(!remote[p.id] && !p.shared){
      const doc = await cloudDoc(p.id); if(!doc) continue;   // 鍵なし暗号化作品は退避しない
      await workRef(p.id).set(doc);
      await pushChapters(p.id, chapCol(p.id));
      remote[p.id] = { ...doc, _shared:false };
    }
  }
  // クラウドの内容で state を作り直す（暗号化作品は鍵があれば復号、無ければロック）
  const ids = Object.keys(remote);
  state.projects = ids.map(id=>({ id, title:remote[id].title||"(無題)", createdAt:remote[id].createdAt||0, encrypted:!!remote[id].encrypted,
      shared:!!remote[id]._shared, ownerUid:remote[id].ownerUid||null, members:remote[id].members||null, inviteOpen:remote[id].inviteOpen!==false }))
                      .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  state.data = {}; _locked = {};
  for(const id of ids){
    const rd = remote[id];
    if(rd.encrypted){
      // 章の暗号文も集めてから、鍵があれば一括復号。無ければロックへ退避
      const chEnc={};
      try{ const chSnap=await chapCol(id).get(); chSnap.forEach(c=>{ const cd=c.data(); if(cd.encrypted&&cd.enc) chEnc[c.id]=cd.enc; }); }catch(e){ console.warn("[Fabula] 章取得失敗 "+id+":", e); }
      _locked[id] = { cloud:true, enc:rd.enc, chEnc };
      const key = await getKey(id);
      if(key){ try{ state.data[id]=await decryptLocked(id, key); delete _locked[id]; }catch(e){ console.warn("[Fabula] 復号失敗 "+id); } }
    } else {
      const data = rd.data || emptyProjectData();
      if(!data.manuscript) data.manuscript = {chapters:[]};
      try{
        const chSnap = await chapCol(id).get();
        const bodies = {}; chSnap.forEach(c=> bodies[c.id]=c.data());
        (data.manuscript.chapters||[]).forEach(ch=>{ const b=bodies[ch.id]; if(b){ ch.body=b.body||""; if(b.title) ch.title=b.title; } else { ch.body=ch.body||""; } });
      }catch(e){ console.warn("[Fabula] 章取得失敗 "+id+":", e); }
      state.data[id] = data;
    }
  }
  if(!state.currentId || (!state.data[state.currentId] && !_locked[state.currentId])) state.currentId = state.projects[0]?.id || null;
  saveLocal();
}

// ===================== クラウド同期（キュー＋失敗時の自動再送） =====================
// 状態はすべて SYNC に集約し、ヘッダーの点と同期パネルがここを読む。
// 送信に失敗した分はキューに残したまま指数バックオフで再送する（捨てない）。
const SYNC = { tries:0, err:"", lastOk:0, retryAt:0, busy:false };
const _syncSet=new Set();                 // 作品ID
const _chSyncSet=new Set();               // "pid::chId"
let _flushTimer=null;
function pendingCount(){ return _syncSet.size + _chSyncSet.size; }
// 表示用の状態。持ち回さず常にここから導出する（状態の二重管理を避ける）
let _authBusy=false;   // Discordログイン処理中
function syncStateNow(){
  if(_authBusy) return "saving";
  if(!fbUser||!fbDb) return "off";
  if(!pendingCount()) return "synced";
  if(SYNC.tries>0) return navigator.onLine ? "retrying" : "offline";
  return navigator.onLine ? "saving" : "offline";
}
const SYNC_LABEL={ synced:"同期済み", saving:"同期中…", retrying:"再送待ち", offline:"オフライン", off:"ローカルのみ" };
function syncDotHtml(st){ return `<span class="sync-dot ${st==="synced"?"":esc(st)}"></span>`; }   // 既定色＝同期済み
function syncText(st){ const n=pendingCount(); return (SYNC_LABEL[st]||"")+(n?`（未送信 ${n}件）`:""); }
function syncChanged(){ updateAuthChip(); renderSyncPanel(); }

function queueSync(id){
  if(!fbUser||!fbDb||!id) return;
  _syncSet.add(id); scheduleFlush(1000);
}
function scheduleFlush(ms){
  clearTimeout(_flushTimer);
  SYNC.retryAt = Date.now()+ms;
  _flushTimer=setTimeout(flushAll, ms);
  syncChanged();
}
function nextWait(){ return Math.min(60000, 2000*Math.pow(2, Math.max(0, Math.min(SYNC.tries-1, 5)))); }   // 2,4,8,16,32,60秒
async function flushAll(){
  if(!fbUser||!fbDb || SYNC.busy) return;
  if(!pendingCount()){ SYNC.retryAt=0; syncChanged(); return; }
  // 送っても無駄なので待つ。復帰は online イベントで拾う（保険で30秒後にも試す）
  if(!navigator.onLine){ scheduleFlush(30000); return; }
  SYNC.busy=true; SYNC.retryAt=0; syncChanged();
  let failed=false, lastErr="";
  try{
    for(const id of [..._syncSet]){
      if(!state.data[id]){ _syncSet.delete(id); continue; }        // 既に削除/ロック中の作品は送らない
      const doc = await cloudDoc(id);
      if(!doc){ _syncSet.delete(id); continue; }                   // 暗号化＆鍵なしは送らない（平文漏れ防止）
      try{ await workRef(id).set(doc); _syncSet.delete(id); }
      catch(e){ failed=true; lastErr=(e&&e.message)||String(e); console.warn("[Fabula] 同期失敗 "+id+":", e); }
    }
    for(const k of [..._chSyncSet]){
      const [pid,chId]=k.split("::");
      const data=state.data[pid]; if(!data){ _chSyncSet.delete(k); continue; }
      const ch=(data.manuscript?.chapters||[]).find(c=>c.id===chId); if(!ch){ _chSyncSet.delete(k); continue; }
      const payload=await cloudChapter(pid, ch); if(!payload){ _chSyncSet.delete(k); continue; }
      try{ await chapCol(pid).doc(chId).set(payload); _chSyncSet.delete(k); }
      catch(e){ failed=true; lastErr=(e&&e.message)||String(e); console.warn("[Fabula] 章同期失敗 "+k+":", e); }
    }
  } finally { SYNC.busy=false; }
  if(failed){
    SYNC.tries++; SYNC.err=lastErr;
    // 失敗トーストは「失敗状態に入った最初の1回」だけ。再送のたびに出すとうるさい
    if(SYNC.tries===1) toast("クラウドに同期できませんでした。接続が戻ると自動で再送します", "err");
    scheduleFlush(nextWait());
  }
  else { SYNC.tries=0; SYNC.err=""; SYNC.lastOk=Date.now(); SYNC.retryAt=0; syncChanged(); }
}
function syncNow(){ SYNC.tries=0; clearTimeout(_flushTimer); flushAll(); }
if(typeof window!=="undefined"){
  window.addEventListener("online",  ()=>{ if(pendingCount()) syncNow(); else syncChanged(); });
  window.addEventListener("offline", syncChanged);
  // タブを閉じる/隠す直前に未送信があれば即送信（デバウンス待ちの1秒を取りこぼさない。保証はできないので best effort）
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && pendingCount()) flushAll(); });
  window.addEventListener("pagehide", ()=>{ if(pendingCount()) flushAll(); });
}
// ---- 同期パネル（ヘッダーの名前をクリック） ----
function agoText(ts){
  if(!ts) return "-";
  const s=Math.round((Date.now()-ts)/1000);
  if(s<10) return "たった今";
  if(s<60) return s+"秒前";
  if(s<3600) return Math.floor(s/60)+"分前";
  return Math.floor(s/3600)+"時間前";
}
function syncPanelHtml(){
  const st=syncStateNow(), n=pendingCount();
  const rows=[`<div class="sync-row"><span>アカウント</span><b>${esc(acctName())}</b></div>`,
              `<div class="sync-row"><span>状態</span><b>${esc(SYNC_LABEL[st]||st)}</b></div>`,
              `<div class="sync-row"><span>最終同期</span><b>${esc(agoText(SYNC.lastOk))}</b></div>`,
              `<div class="sync-row"><span>未送信</span><b>${n?n+"件":"-"}</b></div>`];
  if(SYNC.err) rows.push(`<div class="sync-row"><span>エラー</span><b class="bad">${esc(SYNC.err)}</b></div>`);
  if(SYNC.retryAt>Date.now()) rows.push(`<div class="sync-row"><span>次の送信</span><b>${Math.max(1,Math.round((SYNC.retryAt-Date.now())/1000))}秒後</b></div>`);
  return rows.join("");
}
function renderSyncPanel(){
  const el=document.getElementById("syncPanel"); if(!el) return;
  el.innerHTML=syncPanelHtml();
  const go=document.getElementById("syncGo"); if(go) go.disabled=!pendingCount();
}
function openSyncPanel(){
  openModal(`<div class="menu-head"><span class="menu-title">クラウド同期</span><button class="menu-x" data-close title="閉じる">✕</button></div>
    <div id="syncPanel">${syncPanelHtml()}</div>
    <div class="modal-actions"><button class="btn" data-close>閉じる</button>
      <button class="btn primary" id="syncGo">今すぐ送信</button></div>`,
    (root)=>{
      const go=root.querySelector("#syncGo");
      renderSyncPanel();
      if(go) go.onclick=()=>{ syncNow(); renderSyncPanel(); };
      // 「次の送信まで◯秒」を動かすための更新。パネルが閉じたら自分で止まる
      const t=setInterval(()=>{ if(!document.getElementById("syncPanel")){ clearInterval(t); return; } renderSyncPanel(); }, 1000);
    });
}
// 作品の章を全部 col へ書き出す（共有の開始/解除・初回退避で使う）
async function pushChapters(pid, col){
  for(const ch of (state.data[pid]?.manuscript?.chapters||[])){
    const cp=await cloudChapter(pid, ch); if(cp) await col.doc(ch.id).set(cp);
  }
}
async function deleteRemote(id, ref){   // ref必須：state から外れた後でも消せるよう呼び元が渡す
  if(!fbUser||!fbDb||!id||!ref) return;
  try{
    const chSnap = await ref.collection("chapters").get();   // 章サブコレクションも一緒に削除
    await Promise.all(chSnap.docs.map(d=>d.ref.delete()));
    await ref.delete();
  }catch(e){ console.warn("[Fabula] リモート削除失敗:", e); }
}

// ---- 原稿の章ごと同期（本文は章ドキュメントに別保存。送信は flushAll がまとめて行う） ----
function queueChapterSync(pid, chId){
  if(!fbUser||!fbDb||!pid||!chId) return;
  _chSyncSet.add(pid+"::"+chId); scheduleFlush(1000);
}
function deleteChapterRemote(pid, chId){
  if(!fbUser||!fbDb||!pid||!chId) return;
  chapCol(pid).doc(chId).delete().catch(e=>console.warn("[Fabula] 章削除失敗:", e));
}

// ======================= ライブ同期（onSnapshot）＋ presence =======================
let _liveUnsub=[];
function isEditingNow(){ const a=document.activeElement; return !!(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.isContentEditable)); }
function editingChapterId(){ const a=document.activeElement; return (a && a.id==="msBody") ? _msCurrentChapter : null; }

function startLiveSync(){
  stopLiveSync();
  const p=curProject();
  if(!p || !p.shared || !fbUser || !fbDb) return;
  const id=p.id, wref=worksCol().doc(id);
  _liveUnsub.push(wref.onSnapshot(s=>onWorkSnap(id,s), e=>console.warn("[Fabula] live work:", e)));
  _liveUnsub.push(wref.collection("chapters").onSnapshot(cs=>onChaptersSnap(id,cs), e=>console.warn("[Fabula] live chapters:", e)));
  _liveUnsub.push(wref.collection("presence").onSnapshot(ps=>onPresenceSnap(id,ps), e=>console.warn("[Fabula] live presence:", e)));
  startPresence(id);
}
function stopLiveSync(){ _liveUnsub.forEach(u=>{ try{ u(); }catch(e){} }); _liveUnsub=[]; stopPresence(); _presence=[]; updatePresenceBar(); }

// 作品本体（原稿本文以外＋章の目次）のリモート変更を反映。自分のエコー/編集中は上書きしない。
async function onWorkSnap(id, snap){
  if(id!==state.currentId) return;
  const p=projForId(id); if(!p) return;
  if(!snap.exists){   // オーナーが削除
    stopLiveSync();
    forgetProject(id);
    saveLocal(); renderAll(); noticeModal("共有作品が削除されました", 'この作品はオーナーによって削除されました。<br><span class="muted">この端末からも取り除きました。</span>');
    return;
  }
  if(snap.metadata.hasPendingWrites) return;   // 自分の書き込みのエコーは無視
  const d=snap.data();
  p.title=d.title||p.title; p.members=d.members||p.members; p.inviteOpen=d.inviteOpen!==false; p.ownerUid=d.ownerUid||p.ownerUid;
  let newData=null;
  try{ if(d.encrypted){ const key=await getKey(id); if(key) newData=await decObj(d.enc, key); } else newData=d.data; }
  catch(e){ console.warn("[Fabula] live復号失敗", e); }
  if(newData){
    if(!newData.manuscript) newData.manuscript={chapters:[]};
    const cur=state.data[id]||emptyProjectData();
    const bodies={}; (cur.manuscript?.chapters||[]).forEach(c=>bodies[c.id]=c.body);
    (newData.manuscript.chapters||[]).forEach(c=>{ if(c.body===undefined && bodies[c.id]!==undefined) c.body=bodies[c.id]; });   // 本文は章docで反映するので維持
    state.data[id]=newData;
  }
  if(isEditingNow()) renderProjectBar();           // 入力中はビュー全体の再描画を避ける（打鍵保護）
  else { renderProjectBar(); renderView(); }
  updatePresenceBar();
}

// 章（原稿本文）のリモート変更を反映。編集中の章は触らない。
async function onChaptersSnap(id, cs){
  if(id!==state.currentId) return;
  const data=state.data[id]; if(!data) return;     // ロック中などはスキップ
  if(!data.manuscript) data.manuscript={chapters:[]};
  const chs=data.manuscript.chapters;
  const editId=editingChapterId();
  let changed=false;
  for(const chg of cs.docChanges()){
    if(chg.doc.metadata.hasPendingWrites) continue;   // 自分のエコー無視
    const chId=chg.doc.id;
    if(chId===editId) continue;                        // 編集中の章は打鍵保護で触らない
    if(chg.type==="removed"){ const i=chs.findIndex(c=>c.id===chId); if(i>=0){ chs.splice(i,1); changed=true; } continue; }
    const cd=chg.doc.data(); let title=cd.title||"", body=cd.body||"";
    if(cd.encrypted && cd.enc){ const key=await getKey(id); if(!key) continue; try{ const o=await decObj(cd.enc,key); title=o.title||""; body=o.body||""; }catch(e){ continue; } }
    let c=chs.find(x=>x.id===chId);
    if(!c){ c={id:chId,title,body}; chs.push(c); changed=true; }
    else { if(c.title!==title){ c.title=title; changed=true; } if(c.body!==body){ c.body=body; changed=true; } }
  }
  if(changed){
    saveLocal();
    if(currentView==="manuscript" && !isEditingNow()) renderView();
    else if(typeof renderChapterList==="function" && document.getElementById("msEditor")) renderChapterList();
  }
}

// ---- presence（誰が編集中） ----
let _presence=[], _presenceTimer=null, _presenceId=null;
function myPresenceRef(id){ return worksCol().doc(id).collection("presence").doc(fbUser.uid); }
function writePresence(id){
  if(!fbUser) return;
  const chId=(currentView==="manuscript")?(_msCurrentChapter||""):"";
  myPresenceRef(id).set({ name:acctName(), chId, at:Date.now() }).catch(()=>{});
}
function touchPresence(){ if(_presenceId && fbUser) writePresence(_presenceId); }
function startPresence(id){ stopPresence(); _presenceId=id; writePresence(id); _presenceTimer=setInterval(()=>writePresence(id), 20000); }
function stopPresence(){ if(_presenceTimer){ clearInterval(_presenceTimer); _presenceTimer=null; } if(_presenceId && fbUser){ try{ myPresenceRef(_presenceId).delete(); }catch(e){} } _presenceId=null; }
function onPresenceSnap(id, ps){
  if(id!==state.currentId) return;
  const now=Date.now(), others=[];
  ps.forEach(d=>{ const v=d.data(); if(d.id!==fbUser.uid && v && v.at && (now-v.at)<60000) others.push(v); });
  _presence=others; updatePresenceBar();
}
function updatePresenceBar(){
  const bar=document.getElementById("presenceBar"); if(!bar) return;
  const p=curProject();
  if(!p || !p.shared || !fbUser || !_presence.length){ bar.hidden=true; bar.innerHTML=""; return; }
  bar.hidden=false;
  bar.innerHTML = `<span>共同編集中:</span>` + _presence.map(v=>
    `<span class="present-chip"><span class="edit-dot"></span>${esc(v.name||"参加者")}${v.chId?"（原稿）":""}</span>`).join("");
}
if(typeof window!=="undefined") window.addEventListener("beforeunload", ()=>{ try{ stopPresence(); }catch(e){} });

// ---- 共有リンクで参加 ----
function handleJoinLink(){
  const h = location.hash.startsWith("#") ? location.hash.slice(1) : "";
  if(!h) return;
  const q=new URLSearchParams(h); const id=q.get("join"); if(!id) return;
  const k=q.get("k")||"";
  try{ sessionStorage.setItem("fabula:pendingJoin", JSON.stringify({id,k})); }catch(e){}
  history.replaceState(null,"",location.pathname);   // 鍵をURLに残さない
}
function getPendingJoin(){ try{ return JSON.parse(sessionStorage.getItem("fabula:pendingJoin")||"null"); }catch(e){ return null; } }
function clearPendingJoin(){ try{ sessionStorage.removeItem("fabula:pendingJoin"); }catch(e){} }
async function resolvePendingJoin(){
  const pj=getPendingJoin(); if(!pj||!pj.id) return;
  if(!fbUser){
    openModal(`<h3>共同編集に参加</h3>
      <p class="modal-msg gap">招待された作品に参加するにはログインが必要です。</p>
      <div class="modal-actions"><button class="btn" id="pjCancel">やめる</button><button class="btn primary" id="pjLogin">Discordでログイン</button></div>`,
      (root)=>{ root.querySelector("#pjLogin").onclick=()=>{ closeModal(); loginDiscord(); };
                root.querySelector("#pjCancel").onclick=()=>{ clearPendingJoin(); closeModal(); }; });
    return;
  }
  clearPendingJoin();
  try{
    if(pj.k){ _keyStrs[pj.id]=pj.k; saveKeyStrs(); delete _keyCache[pj.id]; }
    const ref=worksCol().doc(pj.id); const snap=await ref.get();
    if(!snap.exists){ noticeModal("共有作品が見つかりません", '削除された可能性があります。<br><span class="muted">リンクを送ってくれた人に確認してください。</span>'); return; }
    const d=snap.data(), members=d.members||[];
    if(!members.includes(fbUser.uid)){
      if(d.inviteOpen===false){ noticeModal("参加を受け付けていません", 'この作品は新しい参加の受付を停止しています。<br><span class="muted">オーナーに連絡してください。</span>'); return; }
      try{ await ref.update({ members:[...members, fbUser.uid] }); }
      catch(e){ noticeModal("参加できませんでした", escBr(e.message||e) + '<br><span class="muted">受付を停止中か、権限エラーの可能性があります。</span>'); return; }
    }
    await pullFromCloud();
    state.currentId=pj.id; saveLocal(); renderAll(); startLiveSync();
    const jp=projForId(pj.id); toast("共同編集に参加しました：「"+((jp&&jp.title)||"")+"」");
  }catch(e){ noticeModal("参加処理に失敗しました", escBr(e.message||e)); }
}

function updateAuthChip(){
  const chip=document.getElementById("authChip"); if(!chip) return;
  if(fbUser){
    // ログイン時のみ表示（名前＋同期状態）。ログインは☰メニューから
    chip.style.display="inline-flex";
    const name=acctName(), st=syncStateNow();
    // ヘッダーは点だけ。状態は色で示す（名前・件数・原因はクリックで開く同期パネルへ）
    const sig=st+"|"+name+"|"+pendingCount();
    if(chip._sig!==sig){   // 入力のたびに save() が走るので、見た目が変わる時だけDOMを触る
      chip._sig=sig;
      chip.innerHTML=syncDotHtml(st);
      chip.title=syncText(st)+" ・ "+name+" ・ クリックで詳細";
    }
    chip.onclick=openSyncPanel;
  }else{
    chip.style.display="none";   // 未ログインはヘッダーに出さない（☰メニューからログイン）
  }
}

  _resizeT=setTimeout(()=>{ _resizeT=null; if(_bubSim.length){ startBubLoop(); if(_bubbleCharId) positionDetail(); } }, 150); });

document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("searchBtn").onclick=openSearch;
document.getElementById("bookSettingsBtn").onclick=openBookSettings;
document.getElementById("bookPrintBtn").onclick=printBook;
document.getElementById("bookCloseBtn").onclick=closeBook;
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]"); if(!b)return;
  if(b.dataset.view===currentView) return;
  currentView=b.dataset.view; _tagFilter=null;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));
  renderView();
  animateMain();
});
if(!state.currentId && state.projects[0]) state.currentId=state.projects[0].id;
renderAll();
unlockAvailable();   // 鍵を持つ暗号化作品を起動時に復号
initFirebase();
