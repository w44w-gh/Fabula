<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fabula</title>
<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<style>
  :root{
    --bg:#f4f5f5; --surface:#ffffff; --surface-2:#ececee; --text:#17191c; --text-2:#6b7075;
    --border:#e1e2e4; --primary:#0e8c7f; --primary-weak:#dcefeb; --on-primary:#ffffff; --danger:#d2473d;
    --shadow:0 1px 2px rgba(20,25,30,.05);
    --radius:5px;
  }
  :root[data-theme="dark"]{
    --bg:#131517; --surface:#1b1e20; --surface-2:#24282b; --text:#e9eaeb; --text-2:#9aa0a4;
    --border:#30353a; --primary:#15a394; --primary-weak:#10302b; --on-primary:#06201c; --danger:#ff6b6f;
    --shadow:0 1px 3px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131517; --surface:#1b1e20; --surface-2:#24282b; --text:#e9eaeb; --text-2:#9aa0a4;
      --border:#30353a; --primary:#15a394; --primary-weak:#10302b; --on-primary:#06201c; --danger:#ff6b6f;
      --shadow:0 1px 3px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);
    border:1px solid var(--border);border-radius:4px;padding:8px 10px;width:100%}
  textarea{resize:vertical;min-height:70px;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}

  /* ---- header ---- */
  header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:17px;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
  .logo .mark{width:22px;height:22px;border-radius:3px;background:var(--primary);
    display:inline-block}
  .spacer{flex:1}
  .sel-wrap{position:relative;display:inline-flex;align-items:center;max-width:230px;min-width:0}
  .proj-select{width:100%;max-width:230px;padding-right:30px;text-overflow:ellipsis;
    appearance:none;-webkit-appearance:none}
  .sel-wrap::after{content:"";position:absolute;right:12px;top:0;bottom:0;margin:auto;
    width:7px;height:7px;border-right:1.6px solid var(--text-2);border-bottom:1.6px solid var(--text-2);
    transform:translateY(-2px) rotate(45deg);pointer-events:none}
  .enc-badge{display:inline-flex;align-items:center;color:var(--primary)}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:4px;
    padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn:disabled{opacity:.45;cursor:default;pointer-events:none}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.icon{padding:8px;width:36px;justify-content:center}
  .btn.subtle{border-color:transparent;background:transparent;color:var(--text-2)}
  .btn.subtle:hover{background:var(--surface-2);color:var(--text)}
  .btn.danger{color:var(--danger);border-color:var(--danger)}
  .btn.locked{color:var(--text-2);opacity:.6;cursor:default}
  .btn.locked:hover{background:var(--surface)}
  .btn .lock-badge{margin-left:0}

  /* ---- nav ---- */
  nav.tabs{display:flex;gap:4px;padding:8px 14px 0;background:var(--surface);border-bottom:1px solid var(--border);
    position:sticky;top:55px;z-index:15;overflow-x:auto}
  nav.tabs button{border:none;background:none;color:var(--text-2);padding:9px 14px;font-size:14px;font-weight:600;
    border-bottom:2.5px solid transparent;white-space:nowrap}
  nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}

  main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
  .view-head{display:flex;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
  .view-head h2{font-size:18px;margin:0}
  .muted{color:var(--text-2)}
  .empty{text-align:center;color:var(--text-2);padding:60px 16px}
  .empty .big{font-size:15px;margin-bottom:14px}

  /* ---- cards grid (characters) ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
  .card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden}
  .card .row{display:flex;justify-content:flex-end;padding:0 11px 11px}
  /* 並べ替えグリップ（共通）。置き場所は全部「右上」で統一する。本体のクリック＝編集とは別扱い */
  .drag-grip{position:absolute;top:3px;right:3px;z-index:2;
    display:flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:4px;color:var(--text-2);opacity:.45;cursor:grab;
    touch-action:none;user-select:none;-webkit-user-select:none}
  .drag-grip:hover{opacity:1;background:var(--surface-2);color:var(--text)}
  /* グリップの基準になる親と、右上に空けるゆとり */
  .plot-ch-block,.plot-card,.tl-card,.ms-chap,.sc-cmd,.memo-card,.world-item,.rel-row{position:relative}
  .plot-ch-head{padding-right:26px}
  .plot-card .t,.tl-card .t,.world-item .t{padding-right:20px}
  .memo-top{padding-right:24px}
  /* ドラッグ中。影は drop-shadow（背景が透明な入れ物でも中身の形に沿う） */
  .drag-active{position:relative;z-index:5;transition:none;pointer-events:none;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.38))}
  .card.drag-active{border-color:var(--primary)}
  .drag-active .drag-grip{opacity:1;color:var(--text);cursor:grabbing}
  .char-top{display:flex;gap:12px;padding:13px;align-items:flex-start}
  .char-body{min-width:0;flex:1}
  .avatar{width:52px;height:52px;border-radius:5px;flex-shrink:0;object-fit:cover;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px}
  .char-name{font-weight:700;font-size:15px;word-break:break-word;padding-right:20px}
  .char-fields{margin-top:6px;display:flex;flex-direction:column;gap:3px}
  .cf-row{display:flex;gap:8px;font-size:12.5px;line-height:1.5}
  .cf-k{color:var(--text-2);flex:0 0 auto;min-width:52px;max-width:88px;word-break:break-word}
  .cf-v{color:var(--text);flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
  /* ---- character bubble dock ---- */
  #charDock{position:fixed;inset:0;z-index:45;pointer-events:none}
  .cbub{position:fixed;left:0;top:0;width:46px;height:46px;border-radius:50%;border:2px solid var(--surface);padding:0;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:grab;pointer-events:auto;touch-action:none;will-change:transform;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px}
  .cbub img{width:100%;height:100%;object-fit:cover;display:block}
  .cbub:active{cursor:grabbing}
  .cbub.active{outline:2px solid var(--primary);outline-offset:1px}
  .cd-ava{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:2px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px}
  .cd-detail{position:fixed;width:min(280px,72vw);max-height:70vh;overflow:auto;pointer-events:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:13px}
  /* バブル詳細の中の「掴んで本文へ放り込める文字」 */
  .drag-text{cursor:grab;border-radius:3px}
  .drag-text:hover{background:var(--surface-2);box-shadow:0 0 0 3px var(--surface-2)}
  .drag-text:active{cursor:grabbing}
  .cd-detail-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .cd-detail-head .char-name{flex:1;min-width:0}
  .cd-detail-head .cd-ava{width:40px;height:40px;font-size:16px;cursor:default}
  .cd-edit{border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:11.5px;font-weight:600;
    padding:3px 9px;border-radius:4px;cursor:pointer;flex:0 0 auto}
  .cd-edit:hover{background:var(--surface-2)}
  .cd-close{border:none;background:none;color:var(--text-2);font-size:15px;line-height:1;padding:4px;border-radius:6px;cursor:pointer}
  .cd-close:hover{background:var(--surface-2);color:var(--text)}

  /* ---- plot lanes ---- */
  .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
  .lane{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
  .lane h3{margin:2px 4px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
  .lane h3 .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .plot-ch-title{flex:1;min-width:0;font-size:14px;font-weight:700;padding:3px 7px}
  .plot-ch-head{display:flex;align-items:center;gap:7px;margin:0 2px 10px}
  .plot-ch-head .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .plot-ch-head .mini{flex:0 0 auto}
  .plot-ch-block{margin-bottom:24px}
  .lane h3 .mini{flex:0 0 auto}
  .plot-card{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:10px;margin-bottom:8px}
  .plot-card .t{font-weight:700;font-size:13.5px}
  .plot-card .b{font-size:12.5px;color:var(--text-2);margin-top:4px;white-space:pre-wrap}
  .plot-card .row{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
  .mini{border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:3px 7px;font-size:12px;color:var(--text-2)}
  .mini:hover{background:var(--surface-2);color:var(--text)}
  .add-card{width:100%;border:1px dashed var(--border);background:transparent;color:var(--text-2);border-radius:5px;padding:9px;font-size:13px;font-weight:600}
  .add-card:hover{border-color:var(--primary);color:var(--primary)}

  /* ---- world ---- */
  .world-cat{margin-bottom:22px}
  .world-cat h3{font-size:14px;color:var(--primary);border-bottom:1px solid var(--border);padding-bottom:6px;margin:0 0 10px}
  .world-item{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:12px;margin-bottom:9px}
  .world-item .t{font-weight:700;font-size:14px}
  .world-item .b{font-size:13px;color:var(--text-2);margin-top:4px;white-space:pre-wrap}
  .world-item .row{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}

  /* ---- relations ---- */
  .rel-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  #relSvg{width:100%;height:420px;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:
    radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 0) 0 0/22px 22px}
  .rel-node{cursor:grab}
  .rel-node:active{cursor:grabbing}
  .rel-list{margin-top:14px;display:flex;flex-direction:column;gap:7px}
  .rel-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:5px;padding:9px 30px 9px 11px;font-size:13.5px}   /* 右はグリップのぶん空ける */
  .rel-row .lbl{flex:1;color:var(--text-2)}
  .rel-row .rel-call{color:var(--primary);font-size:12.5px;white-space:nowrap}

  /* ---- timeline ---- */
  .timeline{margin-top:4px}
  .tl-item{display:flex;gap:12px;align-items:stretch}
  .tl-when{flex:0 0 96px;text-align:right;font-size:12px;font-weight:700;color:var(--primary);padding-top:12px;word-break:break-word}
  .tl-mid{position:relative;flex:0 0 16px}
  .tl-mid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--border);transform:translateX(-50%)}
  .tl-item:first-child .tl-mid::before{top:14px}
  .tl-item:last-child .tl-mid::before{bottom:calc(100% - 14px)}
  .tl-dot{position:absolute;left:50%;top:14px;width:12px;height:12px;border-radius:50%;background:var(--primary);
    transform:translateX(-50%);border:2px solid var(--surface);z-index:1}
  .tl-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:11px 12px;margin-bottom:10px}
  .tl-card .t{font-weight:700;font-size:14px}
  .tl-card .b{font-size:13px;color:var(--text-2);margin-top:4px;white-space:pre-wrap}
  .tl-chars{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tl-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:3px;padding:2px 9px 2px 6px}
  .tl-chip .cd{width:9px;height:9px;border-radius:50%}
  .tl-card .row{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
  .char-check{display:flex;flex-wrap:wrap;gap:6px}
  .char-check label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--border);
    border-radius:3px;padding:4px 10px;cursor:pointer}
  .char-check input{width:auto}
  .char-check input:checked + span{font-weight:700;color:var(--primary)}

  /* ---- modal ---- */
  @keyframes ovFade{from{opacity:0}to{opacity:1}}
  @keyframes mdPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .overlay{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:70;display:flex;align-items:center;
    justify-content:center;padding:16px;animation:ovFade .14s ease-out}
  .modal{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);width:100%;max-width:540px;
    max-height:90vh;overflow:auto;padding:20px;animation:mdPop .18s cubic-bezier(.2,.7,.3,1)}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important} }
  .modal h3{margin:0 0 16px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:5px}
  .field-row{display:flex;gap:7px;margin-bottom:7px;align-items:center}
  .field-row input:first-child{flex:0 0 34%}
  .field-row .fk{flex:0 0 34%}
  .fld-grip{position:static;flex:0 0 auto;height:30px}   /* 右上ではなく行の左に並べる。他は .drag-grip のまま */
  .modal-msg{font-size:14px;line-height:1.75;margin:2px 0 2px}
  .modal-msg.gap{margin-bottom:12px}            /* 下にボタン以外が続く時 */
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  /* 編集モーダルの上に重ねる確認ダイアログ（下の暗さを足しすぎないよう薄め） */
  .overlay-2{z-index:76;background:rgba(10,14,25,.3)}
  /* 上書き保存の合図：ティールのリングが一瞬出て消える（レイアウトに影響しない outline を使う） */
  @keyframes savedRing{ 0%{outline-color:var(--primary)} 55%{outline-color:var(--primary)} 100%{outline-color:transparent} }
  .saved-flash{outline:2px solid transparent;outline-offset:0;animation:savedRing .55s ease-out}
  /* ---- toast（短い通知。モーダルより上に出る） ---- */
  #toastHost{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
    display:flex;flex-direction:column;gap:8px;align-items:center;
    width:min(520px,calc(100vw - 32px));pointer-events:none}
  .toast{pointer-events:auto;cursor:pointer;max-width:100%;
    background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-left:3px solid var(--primary);border-radius:var(--radius);
    box-shadow:0 6px 20px rgba(10,14,25,.18);
    padding:11px 14px;font-size:13.5px;line-height:1.65;word-break:break-word}
  .toast.err{border-left-color:var(--danger)}
  /* ---- ☰ menu (account) ---- */
  .menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
  .menu-title{font-size:12px;font-weight:700;color:var(--text-2)}
  .menu-x{border:none;background:none;color:var(--text-2);font-size:15px;line-height:1;padding:5px;border-radius:4px}
  .menu-x:hover{background:var(--surface-2);color:var(--text)}
  .menu-acct{display:flex;align-items:center;gap:12px}
  .menu-avatar{width:42px;height:42px;border-radius:5px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--on-primary);font-size:16px;background:var(--primary)}
  .menu-avatar.guest{background:var(--surface-2);color:var(--text-2)}
  .menu-acct-txt{flex:1;min-width:0}
  .menu-acct-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-acct-sub{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px;margin-top:2px}
  .menu-sep{height:1px;background:var(--border);margin:15px 0}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:var(--text);
    padding:10px;border-radius:5px;font-size:14px;font-weight:600;text-align:left}
  .menu-item:hover{background:var(--surface-2)}
  .menu-item.danger{color:var(--danger)}
  .menu-item.danger:hover{background:rgba(229,72,77,.12)}
  .menu-del{border:none;background:none;color:var(--text-2);font-size:12px;padding:5px 2px;cursor:pointer;text-align:left}
  .menu-del:hover{color:var(--danger)}
  .menu-del.danger{color:var(--danger)}                       /* 作品の削除だけ最初から赤 */
  .menu-del.danger:hover{text-decoration:underline}
  .menu-label{font-size:11px;color:var(--text-2);font-weight:700;letter-spacing:.05em;padding:2px 2px 6px}
  .menu-item.locked{color:var(--text-2);opacity:.6;cursor:default}
  .menu-item.locked:hover{background:none}
  .lock-badge{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:700;color:var(--text-2);
    border:1px solid var(--border);border-radius:3px;padding:1px 5px;letter-spacing:.03em}
  .opt-locked{opacity:.6}
  .opt-locked input{cursor:default}
  .share-mems{max-height:168px;overflow:auto;margin-bottom:8px}
  .share-mem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 2px;font-size:13.5px;border-bottom:1px solid var(--border)}
  .edit-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary);margin-right:6px;vertical-align:middle}
  .present-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--text-2);margin:2px 0 8px}
  .present-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 9px}
  .menu-tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 2px;font-size:13.5px;cursor:pointer}
  .sw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 auto}
  .sw input{position:absolute;opacity:0;width:0;height:0;margin:0}
  .sw>span{position:absolute;inset:0;background:var(--border);border-radius:999px;transition:background .18s}
  .sw>span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .sw input:checked+span{background:var(--primary)}
  .sw input:checked+span::before{transform:translateX(16px)}
  /* ---- manuscript (原稿) ---- */
  .ms-wrap{display:flex;gap:14px;align-items:flex-start}
  .ms-side{flex:0 0 212px;display:flex;flex-direction:column;gap:8px}
  .ms-chaps{display:flex;flex-direction:column;gap:5px}
  .ms-chap{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:5px;
    background:var(--surface);padding:8px 28px 8px 9px;cursor:pointer}   /* 右はグリップのぶん空ける */
  .ms-chap.active{border-color:var(--primary);background:var(--primary-weak)}
  .ms-chap-main{flex:1;min-width:0}

  .bk-kashira{position:absolute;top:6mm;left:0;right:0;text-align:center;font-size:7pt;color:#666;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif}

    font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  @media print{
    header, nav.tabs, #main, #overlayHost{ display:none !important; }
    #bookOverlay{ position:static !important; background:#fff !important; display:block !important; }
    .book-bar{ display:none !important; }

    /* 体験版：製本プレビューを開いていても⌘Pで中身を出さない */

    body[data-trial="1"]::after{ content:"体験版ではPDF出力・印刷はできません。Discordでログインすると使えます。";
      display:block; padding:24pt; font-size:11pt; color:#111; font-family:sans-serif; }
  }
  .ms-vert{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;width:100%;height:60vh;overflow-x:auto;overflow-y:hidden;
    border:1px solid var(--border);border-radius:5px;padding:18px;background:var(--surface);
    font-size:17px;line-height:2;font-family:"Hiragino Mincho ProN","YuMincho","Yu Mincho",serif;text-align:justify}
  .ms-vert p{margin:0 0 .2em}
  .ms-vert rt{font-size:.5em;color:var(--text-2)}
  /* リアルタイム縦書き（エディタ横の分割） */
  .ms-edit-wrap{display:flex;gap:12px}
  .ms-edit-wrap #msBody{width:100%}

  .ms-edit-wrap.split .ms-vert-live{display:block;flex:1;min-width:0}
  .btn.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

    .ms-edit-wrap.split{flex-direction:column} }
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}

  @media (max-width:520px){ .sel-wrap,.proj-select{max-width:140px} main{padding:14px 12px 80px} }
  /* ---- auth chip ---- */
  /* 🔍 ☰ と同じ見た目・同じ高さに揃える（中身が8pxの点だけなので高さは明示する） */

  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:0 0 auto}
  .sync-dot.saving{background:#f5a524;animation:syncPulse 1.1s ease-in-out infinite}

    font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}

<body>

  <span class="enc-badge" id="encBadge" title="暗号化された作品" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M11.5 11.5 21 2"/><path d="M15.5 7.5l3 3"/></svg></span>

    <b>製本プレビュー</b>

    <button class="btn primary" id="bookPrintBtn">PDFに保存 / 印刷</button>
    <button class="btn" id="bookCloseBtn">閉じる</button>
  </div>

<script>
"use strict";
// ============================ 保存層（今はローカル。将来Firestoreに差し替え可能） ============================
const STORE_KEY = "fabula:v1";
const COLORS = ["#0e8c7f","#e5484d","#f5a524","#30a46c","#3b7dd8","#e93d82","#0091ff","#8d6e63","#12a594","#d6409f"];

// ---- 暗号化（作品ごとAES-GCM。鍵は fabula:keys に別保存。localStorage/クラウドは暗号文、メモリ上は復号済み平文） ----
const _b64=(b)=>btoa(String.fromCharCode(...new Uint8Array(b)));
const _ub64=(s)=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function newCryptoKey(){ return crypto.subtle.generateKey({name:"AES-GCM",length:256}, true, ["encrypt","decrypt"]); }
async function exportKeyStr(k){ return _b64(await crypto.subtle.exportKey("raw", k)); }
async function importKeyStr(s){ return crypto.subtle.importKey("raw", _ub64(s), {name:"AES-GCM"}, true, ["encrypt","decrypt"]); }
async function encObj(obj, key){ const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv:_b64(iv), ct:_b64(ct) }; }
async function decObj(enc, key){ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:_ub64(enc.iv)}, key, _ub64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt)); }
function loadKeyStrs(){ try{ return JSON.parse(localStorage.getItem("fabula:keys"))||{}; }catch(e){ return {}; } }
let _keyStrs=loadKeyStrs(); const _keyCache={};
function saveKeyStrs(){ try{ localStorage.setItem("fabula:keys", JSON.stringify(_keyStrs)); }catch(e){} }
async function getKey(id){ if(_keyCache[id]) return _keyCache[id]; const s=_keyStrs[id]; if(!s) return null;
  try{ const k=await importKeyStr(s); _keyCache[id]=k; return k; }catch(e){ return null; } }

let _locked={};                       // { pid: {__enc} } 復号できていない暗号化作品（state.dataには入れない）
let state = load();
partitionLocked();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem("storyforge:v1"); // 旧名(StoryForge)のデータも自動で引き継ぐ
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { projects:[], currentId:null, data:{} };
}
function partitionLocked(){ _locked={}; for(const p of (state.projects||[])){ const d=state.data[p.id]; if(d&&d.__enc){ _locked[p.id]=d; delete state.data[p.id]; } } }
async function unlockAvailable(){   // 鍵を持っている暗号化作品を復号してstateへ
  let changed=false;
  for(const id of Object.keys(_locked)){ const key=await getKey(id); if(!key) continue;
    try{ state.data[id]=await decryptLocked(id, key); delete _locked[id]; changed=true; }catch(e){ console.warn("[Fabula] 復号失敗 "+id); } }
  if(changed) renderAll();
}
// localStorage保存：暗号化作品は暗号文で書く（crypto非同期のため直列化。非暗号化は従来どおり平文）
let _saveChain=Promise.resolve();
function saveLocal(){ _saveChain=_saveChain.then(doSaveLocal, doSaveLocal); return _saveChain; }
async function doSaveLocal(){
  try{
    const data={};
    for(const p of state.projects){ const id=p.id;
      if(_locked[id]){ data[id]=_locked[id]; continue; }        // 未復号はそのまま保持
      const plain=state.data[id]; if(plain===undefined) continue;
      if(p.encrypted){ const key=await getKey(id); data[id]= key ? { __enc: await encObj(plain, key) } : plain; }  // 鍵欠落時は喪失回避で平文
      else data[id]=plain;
    }
    localStorage.setItem(STORE_KEY, JSON.stringify({ projects:state.projects, currentId:state.currentId, data }));
  }catch(e){ console.warn("[Fabula] ローカル保存失敗:", e); }
}
function save(){ saveLocal(); queueSync(state.currentId); }   // ローカル保存＋（ログイン時）クラウド同期
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function emptyProjectData(){ return { characters:[], plot:{structure:"kishoutenketsu",cards:[],chapters:[]}, world:[], relations:[], timeline:[], manuscript:{chapters:[]}, scenario:{scenes:[],vars:[]}, memos:[], tabVis:{}, charTemplate:null }; }
// キャラの項目テンプレート（作品ごと）。null/未設定なら既定の6項目。空配列なら「項目なしで作る」
function defaultCharFields(){ return [{k:"身長",v:""},{k:"体重",v:""},{k:"年齢",v:""},{k:"種族",v:""},{k:"一人称",v:""},{k:"性格",v:""}]; }
function charTemplate(){ const d=cur(); return Array.isArray(d && d.charTemplate) ? d.charTemplate : defaultCharFields(); }
function createProject(title, data){   // 作品レコードを作って選択状態にする（保存/再描画は呼び元）
  const id=uid(); state.projects.push({id, title, createdAt:Date.now()}); state.data[id]=data; state.currentId=id; return id;
}
function cur(){ return state.data[state.currentId]; }
function curProject(){ return state.projects.find(p=>p.id===state.currentId); }

let currentView = "characters";

// ============================ 画像: アップロード時に縮小してdataURL化（localStorage肥大を防ぐ） ============================
function fileToSmallDataUrl(file, max=320){
  return new Promise((res,rej)=>{
    const img = new Image(); const fr = new FileReader();
    fr.onload = ()=>{ img.onload = ()=>{
      const sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82));
    }; img.onerror=rej; img.src = fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

// ============================ プロジェクト ============================
// 鍵のピクトグラム（暗号化マーク。絵文字は使わない）
function keyIconSvg(px){ return `<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M11.5 11.5 21 2"/><path d="M15.5 7.5l3 3"/></svg>`; }
// タブの表示/非表示（★作品ごと。作品データ内 data.tabVis に保存＝端末間で同期・エクスポートにも含む。未指定=表示）
const TABS = [["characters","キャラクター"],["plot","プロット"],["world","世界観"],["relations","相関図"],["timeline","タイムライン"],["manuscript","原稿"],["scenario","シナリオ"],["memo","メモ"]];
function isTabVisible(v){ const d=cur(); return !(d && d.tabVis && d.tabVis[v]===false); }
function applyTabVis(){
  TABS.forEach(([v])=>{ const b=document.querySelector(`#tabs button[data-view="${v}"]`); if(b) b.hidden = !isTabVisible(v); });
  if(!isTabVisible(currentView)){ const first=TABS.find(([v])=>isTabVisible(v)); if(first){ currentView=first[0];
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x.dataset.view===currentView)); } }
}
function renderProjectBar(){
  const sel = document.getElementById("projSelect");
  sel.innerHTML = state.projects.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join("")
    || `<option disabled selected>作品がありません</option>`;
  if(state.currentId) sel.value = state.currentId;
  const p = curProject();
  const badge = document.getElementById("encBadge"); if(badge) badge.hidden = !(p && p.encrypted);   // 暗号化作品なら鍵アイコンを表示
  document.getElementById("tabs").hidden = !p;
  applyTabVis();   // タブの表示/非表示を反映
}
function switchProject(id){ state.currentId=id; _tagFilter=null; save(); renderAll(); animateMain(); startLiveSync(); }

function openProjectModal(){
  if(!canAddProject()) return;   // 上限時はメニュー側がグレーアウト済み（案内ダイアログは出さない）
  const encOk = isFull();   // 暗号化(E2E)は支援者限定
  openModal(`<h3>新しい作品</h3>
    <div class="field"><label>タイトル</label><input id="pTitle" placeholder="作品名" autofocus></div>
    <label class="${encOk?"":"opt-locked"}" style="display:flex;gap:8px;align-items:flex-start;margin:2px 0 6px;font-size:13.5px;cursor:${encOk?"pointer":"default"}">
      <input type="checkbox" id="pEnc" ${encOk?"":"disabled"} style="margin-top:3px;width:auto;flex:0 0 auto"><span>この作品を暗号化する${encOk?"":`<span class="lock-badge">支援者</span>`}<br>
      <span class="muted" style="font-size:11.5px">${encOk
        ? "本人のみ復号。別端末で開くには復元キーが必要・鍵を失うと復元できません"
        : "暗号化は支援者向けの機能です"}</span></span></label>
    <div class="modal-actions">
      <button class="btn" data-close>キャンセル</button>
      <button class="btn primary" id="pCreate">作成</button>
    </div>`, (root)=>{
      const create=async ()=>{
        const title=root.querySelector("#pTitle").value.trim(); if(!title){toast("タイトルを入力してください","err");return;}
        const enc=encOk && root.querySelector("#pEnc").checked;   // 体験版では常にfalse
        const id=createProject(title, emptyProjectData());
        if(enc){
          const key=await newCryptoKey(); const s=await exportKeyStr(key);
          _keyStrs[id]=s; saveKeyStrs(); _keyCache[id]=key;
          const pr=state.projects.find(x=>x.id===id); if(pr) pr.encrypted=true;
          save(); closeModal(); renderAll(); showRecoveryKey(s);
        } else { save(); closeModal(); renderAll(); }
      };
      root.querySelector("#pCreate").onclick=create;
      root.querySelector("#pTitle").addEventListener("keydown",e=>{ if(e.key==="Enter") create(); });
    });
}
function showRecoveryKey(s){
  openModal(`<h3>復元キー（必ず保管してください）</h3>
    <p style="font-size:13.5px;line-height:1.7;margin:2px 0 8px">この作品は暗号化されました。<b>別の端末で開くにはこのキーが必要</b>です。<br>

// ============================ 各ビュー描画 ============================
// ---- アニメーション（prefers-reduced-motion 尊重） ----
function prefersReduced(){ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function flashIn(el){ if(!el||prefersReduced())return; el.animate([{opacity:0,transform:'translateY(-5px)'},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.7,.3,1)'}); }
// ---- 削除の演出：対象を細かい破片に分けて散らす ----
// 同じ要素を複製し、clip-path でタイル状に切り出して1枚ずつ飛ばす＝ライブラリ不要・画像化も不要。
// 左から順に崩れるようディレイをずらし、終わってから done()（＝実データの削除と再描画）を呼ぶ。
const SHATTER={tile:34, maxCols:20, maxRows:10, dur:380, durJit:120, delay:190, delayJit:60, nodeBudget:4000};
// 保存の演出は削除の逆再生。散らばった破片が左から順に収まって1枚のカードになる。
const ASSEMBLE={dur:300, durJit:80, delay:150, delayJit:45};
// 要素を clip-path のタイルに分割した「破片セット」を作る（削除＝散らす／保存＝集める で共用）
function buildTiles(el, r){
  // 破片の数は要素の大きさに合わせる（小さいカードは粗く、大きいカードは細かく）
  let cols=Math.max(6, Math.min(SHATTER.maxCols, Math.round(r.width/SHATTER.tile)));
  let rows=Math.max(3, Math.min(SHATTER.maxRows, Math.round(r.height/SHATTER.tile)));
  // 破片は1枚ずつ要素まるごとの複製なので、中身が多い要素（章ブロック等）は枚数を落とす
  const budget=Math.max(12, Math.round(SHATTER.nodeBudget/(1+el.getElementsByTagName("*").length)));
  if(cols*rows>budget){ const k=Math.sqrt(budget/(cols*rows));
    cols=Math.max(4, Math.round(cols*k)); rows=Math.max(2, Math.round(rows*k)); }
  const host=document.createElement("div");
  host.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;pointer-events:none;z-index:80`;
  const pieces=[];
  for(let gy=0; gy<rows; gy++) for(let gx=0; gx<cols; gx++){
    const piece=el.cloneNode(true);
    piece.removeAttribute("id");
    piece.style.cssText=`position:absolute;left:0;top:0;width:${r.width}px;height:${r.height}px;margin:0`;
    const x0=gx*100/cols, x1=(gx+1)*100/cols, y0=gy*100/rows, y1=(gy+1)*100/rows;
    piece.style.clipPath=`polygon(${x0}% ${y0}%, ${x1}% ${y0}%, ${x1}% ${y1}%, ${x0}% ${y1}%)`;
    host.appendChild(piece);
    pieces.push({ el:piece, t: cols>1 ? gx/(cols-1) : 0 });   // t=左端0〜右端1（時間差に使う）
  }
  return { host, pieces };
}
// 散らばった状態（保存の演出の開始位置 ＝ 削除の演出の終了位置）
function scatterKey(t){
  return { transform:`translate(${10+t*24+Math.random()*12}px, ${-4-Math.random()*22}px) rotate(${Math.random()*14-7}deg) scale(.92)`, opacity:0 };
}
const SETTLED={ transform:"translate(0,0) rotate(0deg) scale(1)", opacity:1 };
function shatter(el, done){
  const r=el.getBoundingClientRect();
  if(!r.width || !r.height){ done(); return; }
  const { host, pieces } = buildTiles(el, r);
  pieces.forEach(p=>{
    p.el.animate([SETTLED, scatterKey(p.t)],
      { duration:SHATTER.dur+Math.random()*SHATTER.durJit, delay:p.t*SHATTER.delay+Math.random()*SHATTER.delayJit,
        easing:"cubic-bezier(.25,.6,.35,1)", fill:"forwards" });
  });
  document.body.appendChild(host);
  el.style.visibility="hidden";
  setTimeout(()=>{ host.remove(); done(); }, SHATTER.dur+SHATTER.durJit+SHATTER.delay+SHATTER.delayJit+40);
}
// 上書き保存の合図：すでに画面にあるカードなので、作り直す演出(assemble)は意味が合わない。
// ティールのリングが一瞬走って、わずかに沈み込むだけ＝「いま反映された」を示す。
function flashUpdated(el){
  if(!el || prefersReduced()) return;
  el.classList.remove("saved-flash"); void el.offsetWidth;   // 連続保存でも再生し直せるように
  el.classList.add("saved-flash");
  const off=()=>{ el.classList.remove("saved-flash"); el.removeEventListener("animationend", off); };
  el.addEventListener("animationend", off);
  el.animate([{transform:"translateY(-2px)"},{transform:"none"}],
    {duration:260, easing:"cubic-bezier(.2,.7,.3,1)"});
}
// 保存の演出：破片が左から順に収まってカードになる。削除より少し速い。
let _asmCancel=null;
function assemble(el){
  if(prefersReduced() || !el) return;
  if(_asmCancel) _asmCancel();   // 連続保存で前の演出が残らないように
  const r=el.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const { host, pieces } = buildTiles(el, r);
  let last=0;
  pieces.forEach(p=>{
    const dur=ASSEMBLE.dur+Math.random()*ASSEMBLE.durJit;
    const delay=p.t*ASSEMBLE.delay+Math.random()*ASSEMBLE.delayJit;
    last=Math.max(last, dur+delay);
    p.el.animate([scatterKey(p.t), SETTLED],
      { duration:dur, delay, easing:"cubic-bezier(.2,.7,.3,1)", fill:"backwards" });
  });
  document.body.appendChild(host);
  el.style.visibility="hidden";
  const cancel=()=>{ if(_asmCancel===cancel) _asmCancel=null; clearTimeout(timer); host.remove(); el.style.visibility=""; };
  _asmCancel=cancel;
  const timer=setTimeout(cancel, last+40);
}
// 削除対象のカードを探して砕く。target は id（既定は #main の [data-id]）か要素そのもの。
// 対象が見つからなければ即 done()（付け忘れても壊れない代わりに黙って無効になる）。
function withShatter(id, done){
  if(prefersReduced()){ done(); return; }
  let el=null;
  const v=(window.CSS&&CSS.escape) ? CSS.escape(String(id)) : String(id);
  try{ el=document.querySelector(`#main [data-id="${v}"]`); }catch(e){}
  if(!el){ done(); return; }
  shatter(el, done);
}
function animateMain(){ if(prefersReduced())return; const m=document.getElementById("main"); if(m) m.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:180,easing:'ease-out'}); }
let _flashId=null, _flashMode=null;
// 保存直後のカードに演出を付ける。
//   新規(isNew) … assemble（破片が集まって出来上がる＝削除の逆再生）
//   上書き       … flashUpdated（リングが一瞬光るだけ。カードはもう在るので作り直さない）
// assemble は要素を一瞬隠すので、追加直後に入力欄へフォーカスするもの
// （メモ・章・シーン）は従来どおり flashIn のまま。
function flashSaved(id, isNew){ _flashId=id; _flashMode = isNew ? "assemble" : "update"; }
function applyFlash(){ if(!_flashId)return;

function isDevHost(){ const h=location.hostname;
  return h==="localhost" || h==="127.0.0.1" || h==="::1" || h==="[::1]" || h.endsWith(".localhost"); }

  try{ return isDevHost() && localStorage.getItem('fabula:full')==='1'; }catch(e){ return false; } }

// ---- キャラ・バブル（独立した丸バブルが画面に浮く。バネ物理でぽよん・ドラッグ移動・クリックで詳細） ----
let _bubbleCharId=null, _bubSim=[], _bubRAF=null, _bubDrag=null, _detailSig=null;

function syncActiveBubbles(){ _bubSim.forEach(n=>n.el&&n.el.classList.toggle("active", n.id===_bubbleCharId)); }
function renderCharBubbles(){   // DOMとキャラ一覧を同期し、物理ループを起動

  if(_bubbleCharId && !chars.find(c=>c.id===_bubbleCharId)) _bubbleCharId=null;
  const byId={}; _bubSim.forEach(n=>byId[n.id]=n);

function attachBubbleDrag(el, node){
  let sx=null,sy=null,moved=false,ox=0,oy=0;
  el.onpointerdown=(e)=>{ sx=e.clientX;sy=e.clientY;moved=false; ox=e.clientX-node.x; oy=e.clientY-node.y; _bubDrag=node; node.vx=0;node.vy=0; try{el.setPointerCapture(e.pointerId);}catch(_){} startBubLoop(); };
  el.onpointermove=(e)=>{ if(sx==null)return; if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>5)moved=true;
    if(moved){ const nx=e.clientX-ox, ny=e.clientY-oy; node.vx=nx-node.x; node.vy=ny-node.y; node.x=nx; node.y=ny; } };
  el.onpointerup=(e)=>{
    const wasDrag=moved; if(_bubDrag===node)_bubDrag=null;
    if(wasDrag){ startBubLoop(); }
    else {
      if(_bubbleCharId===node.id){ closeBubbleDetail(); }
      else { _bubbleCharId=node.id; syncActiveBubbles(); renderBubbleDetail(); animateDetailOpen(); }
    }
    sx=sy=null; moved=false;
  };
}
function stepBubbles(){
  const W=window.innerWidth, H=window.innerHeight, R=54, DAMP=0.82; let active=false; const n=_bubSim.length;
  for(let i=0;i<n;i++){ const a=_bubSim[i];
    for(let j=i+1;j<n;j++){ const b=_bubSim[j];
      let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy; if(d2<1){d2=1;dx=Math.random()-.5;dy=Math.random()-.5;}
      const dd=Math.sqrt(d2);
      if(dd<R){ const f=(R-dd)*0.14, fx=dx/dd*f, fy=dy/dd*f;
        if(a!==_bubDrag){ a.vx+=fx; a.vy+=fy; } if(b!==_bubDrag){ b.vx-=fx; b.vy-=fy; } }
    }
  }
  for(const nd of _bubSim){
    if(nd===_bubDrag){ if(nd.el) nd.el.style.transform=`translate(${nd.x}px,${nd.y}px)`; active=true; continue; }
    nd.vx*=DAMP; nd.vy*=DAMP; nd.x+=nd.vx; nd.y+=nd.vy;
    if(nd.x<4){nd.x=4;nd.vx*=-0.35;} else if(nd.x>W-46){nd.x=W-46;nd.vx*=-0.35;}
    if(nd.y<58){nd.y=58;nd.vy*=-0.35;} else if(nd.y>H-46){nd.y=H-46;nd.vy*=-0.35;}
    if(nd.el) nd.el.style.transform=`translate(${nd.x}px,${nd.y}px)`;
    if(Math.abs(nd.vx)>0.08||Math.abs(nd.vy)>0.08) active=true;
  }
  if(_bubbleCharId) positionDetail();
  if(active){ _bubRAF=requestAnimationFrame(stepBubbles); }
  else { _bubRAF=null; saveBubblePos(); }   // 静止したら保存して停止
}
function startBubLoop(){ if(!_bubRAF && _bubSim.length) _bubRAF=requestAnimationFrame(stepBubbles); }
function stopBubLoop(){ if(_bubRAF){ cancelAnimationFrame(_bubRAF); _bubRAF=null; } }

const GRIP_SVG = `<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/><circle cx="3" cy="8" r="1.2"/><circle cx="7" cy="8" r="1.2"/><circle cx="3" cy="13" r="1.2"/><circle cx="7" cy="13" r="1.2"/></svg>`;
let _frSeq=0;
function fieldRow(f, vPlaceholder){ return `<div class="field-row" data-id="fr${++_frSeq}"><span class="drag-grip fld-grip" title="ドラッグで並べ替え">${GRIP_SVG}</span><input class="fk" placeholder="項目名" value="${esc(f.k)}"><input class="fv" placeholder="${esc(vPlaceholder||"内容")}" value="${esc(f.v)}"><button class="mini rm" title="削除">×</button></div>`; }
function bindFieldRemovers(root){ root.querySelectorAll("#cFields .rm").forEach(b=>b.onclick=()=>{ b.closest(".field-row").remove(); }); }
// ---- 並べ替え（ドラッグ）。host直下の子が単位。DOM順を commit(ids) でデータ側へ書き戻す ----
// 並べ替えの単位は host の直下の子で、目印は data-id だけ。
// data-id が無い子（「＋カード」「追加:」バー・カテゴリ見出し等）は並べ替え対象外になる。
function dragId(el){ return (el && el.dataset && el.dataset.id) || ""; }
function bindCardDrag(host, commit){
  if(!host) return;
  host.dataset.dragHost="1";
  host._dragCommit=commit;
  if(host._dragBound) return;   // 委譲なので1回で足りる（あとから増えた行もそのまま掴める）
  host._dragBound=true;
  // グリップのクリックで編集などを開かない（capture で先に止める）
  host.addEventListener("click", e=>{ if(e.target.closest(".drag-grip")) e.stopPropagation(); }, true);
  host.addEventListener("pointerdown", e=>{
    const g=e.target.closest(".drag-grip"); if(!g) return;
    if(e.pointerType==="mouse" && e.button!==0) return;
    // 入れ子（選択肢の中のコマンド等）では外側の host にもイベントが上がってくるので、
    // 担当かどうかはドラッグ開始時に見る（bind の順番に依存させない）。
    if(g.closest("[data-drag-host]")!==host) return;
    let card=g; while(card && card.parentElement!==host) card=card.parentElement;
    if(!card) return;
    const items=()=>[...host.children].filter(el=>dragId(el));
    if(items().length<2) return;
    e.preventDefault(); e.stopPropagation();
    const order0=items().map(dragId).join(",");
    let sx=e.clientX, sy=e.clientY, px=e.clientX, py=e.clientY;
    let rect=card.getBoundingClientRect();
    card.classList.add("drag-active");
    // イベントは window で受ける。グリップに setPointerCapture すると、
    // insertBefore で親をDOMで動かした瞬間にキャプチャが外れて
    // 1回入れ替えたところでドラッグが死ぬ。
    const others=()=>items().filter(el=>el!==card);
    // 当たり判定は「レイアウト上の位置」で持つ（lay）。
    // 滑っている最中の getBoundingClientRect() は移動途中の位置を返すので、
    // それで判定すると滑ってきた相手に引っかかって入れ替えが往復し、後ろが高速で暴れる。
    const lay=new Map();
    let hostX=0, hostY=0;
    const measure=()=>{
      const hr=host.getBoundingClientRect(); hostX=hr.left; hostY=hr.top;
      lay.clear();
      const sibs=others();
      for(const el of sibs){ if(el._flip){ el._flip.cancel(); el._flip=null; } }  // 先に全部止める
      for(const el of sibs){ lay.set(el, el.getBoundingClientRect()); }           // 読みはまとめて（止めながら測るとレイアウトが毎回走る）
    };
    measure();
    // 入れ替えると自分のレイアウト位置も動くので、動いた分だけ基準をずらす（でないと毎回1段ぶん取りこぼす）。
    // 他は旧位置→新位置へ滑らせる（FLIP）。
    const reorder=(fn)=>{
      const before=new Map(others().map(el=>[el, el.getBoundingClientRect()]));  // 見た目の現在位置（アニメ中の位置込み）
      const pl=rect.left, pt=rect.top;
      fn();
      card.style.transform=""; rect=card.getBoundingClientRect();
      sx+=rect.left-pl; sy+=rect.top-pt;
      card.style.transform="translate("+(px-sx)+"px,"+(py-sy)+"px)";
      measure();
      if(prefersReduced()) return;
      for(const [el, r] of lay){
        const b=before.get(el); if(!b) continue;
        const dx=b.left-r.left, dy=b.top-r.top;
        if(dx||dy) el._flip=el.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:170, easing:"cubic-bezier(.2,.7,.3,1)"});
      }
    };
    const move=ev=>{
      px=ev.clientX; py=ev.clientY;
      card.style.transform="translate("+(px-sx)+"px,"+(py-sy)+"px)";
      const hr=host.getBoundingClientRect();
      if(Math.abs(hr.left-hostX)>1 || Math.abs(hr.top-hostY)>1) measure();   // スクロール等でずれたら測り直す
      // 判定の基準点は「掴んでいるもの自身の中心」。ポインタ位置で見ると、
      // グリップの位置（上端や右上）によって当たったり当たらなかったりする。
      // 内側を少し削るのはヒステリシス（境目でばたつかせない）。
      const inside=(el)=>{ const r=lay.get(el); if(!r) return false;
        const mx=r.width*0.15, my=r.height*0.15;
        const cx=rect.left+(px-sx)+rect.width/2, cy=rect.top+(py-sy)+rect.height/2;
        return cx>=r.left+mx && cx<=r.right-mx && cy>=r.top+my && cy<=r.bottom-my; };
      // 1イベントで大きく動いた時（速いドラッグ）も追いつくよう、必要な回数だけ入れ替える。
      // 同じ相手を2回続けて掴むのは行ったり来たりなので止める。
      let prev=null;
      for(let k=items().length; k>0; k--){
        const kids=items();
        const hit=kids.find(el=>el!==card && inside(el));
        if(!hit || hit===prev) break;
        prev=hit;
        const after = kids.indexOf(hit) > kids.indexOf(card);
        reorder(()=>host.insertBefore(card, after ? hit.nextElementSibling : hit));
      }
    };
    const up=()=>{
      window.removeEventListener("pointermove", move, true);
      window.removeEventListener("pointerup", up, true);
      window.removeEventListener("pointercancel", up, true);
      card.classList.remove("drag-active"); card.style.transform="";
      for(const el of others()){ if(el._flip){ el._flip.cancel(); el._flip=null; } }
      const ids=items().map(dragId);
      if(ids.join(",")!==order0 && typeof host._dragCommit==="function") host._dragCommit(ids);
    };
    window.addEventListener("pointermove", move, true);
    window.addEventListener("pointerup", up, true);
    window.addEventListener("pointercancel", up, true);
  });
}
function gripHtml(){ return `<span class="drag-grip" title="ドラッグで並べ替え">${GRIP_SVG}</span>`; }
// 絞り込み表示でも破綻しないよう、ids が元々占めていた位置だけを ids の順で埋め直す
function reorderById(arr, ids){
  const set=new Set(ids), byId={}, slots=[];
  arr.forEach((x,i)=>{ if(set.has(x.id)){ byId[x.id]=x; slots.push(i); } });
  slots.forEach((pos,k)=>{ const x=byId[ids[k]]; if(x) arr[pos]=x; });
}

// 相関図：力学レイアウト（反発＋バネ＋減衰）＋ドラッグで「ふにふに」動く
let _relSim=null, _relMode='relation';   // 'relation'=関係ラベル / 'call'=呼び方を矢印に表示
function startRelSim(chars,rels){
  const svg=document.getElementById("relSvg"); if(!svg) return;
  const W=800,H=420,cx=W/2,cy=H/2,R=Math.min(W,H)/2-70;
  const nodes=chars.map((c,i)=>{ const a=-Math.PI/2+i*2*Math.PI/chars.length;
    return { id:c.id, c, x:cx+R*Math.cos(a), y:cy+R*Math.sin(a), vx:0, vy:0 }; });
  const nodeById={}; nodes.forEach(n=>nodeById[n.id]=n);
  const edges=rels.map(r=>({from:nodeById[r.from], to:nodeById[r.to], r})).filter(e=>e.from&&e.to);
  const sim={ svg, W,H,cx,cy, nodes, nodeById, edges, drag:null, dragX:0, dragY:0, reduced:prefersReduced() };
  _relSim=sim;
  setupRelDrag(sim);
  if(sim.reduced){ for(let k=0;k<200;k++) stepRel(sim); drawRel(sim); }
  else { const loop=()=>{ if(!document.body.contains(sim.svg)) return; stepRel(sim); drawRel(sim); requestAnimationFrame(loop); }; loop(); }
}
function stepRel(sim){
  const nodes=sim.nodes, edges=sim.edges;
  const REST=150, K_SPRING=0.015, K_REP=5400, K_CENTER=0.008, DAMP=0.86;
  for(let i=0;i<nodes.length;i++){ const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy; if(d2<1){d2=1;dx=Math.random();dy=Math.random();}
      const d=Math.sqrt(d2), f=K_REP/d2, fx=dx/d*f, fy=dy/d*f;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
  }
  edges.forEach(e=>{ let dx=e.to.x-e.from.x, dy=e.to.y-e.from.y; const d=Math.hypot(dx,dy)||1;
    const f=(d-REST)*K_SPRING, fx=dx/d*f, fy=dy/d*f;
    e.from.vx+=fx; e.from.vy+=fy; e.to.vx-=fx; e.to.vy-=fy;
  });
  nodes.forEach(n=>{
    if(sim.drag===n){ n.x=sim.dragX; n.y=sim.dragY; n.vx=0; n.vy=0; return; }
    n.vx+=(sim.cx-n.x)*K_CENTER; n.vy+=(sim.cy-n.y)*K_CENTER;
    n.vx*=DAMP; n.vy*=DAMP; n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(26,Math.min(sim.W-26,n.x)); n.y=Math.max(26,Math.min(sim.H-40,n.y));
  });
}
function drawRel(sim){
  const R=24;
  // 同じ2点間の複数関係（双方向など）はまとめて、重ならないよう左右に振り分ける
  const groups={};
  sim.edges.forEach(e=>{ const k=[e.from.id,e.to.id].sort().join('~'); (groups[k]=groups[k]||[]).push(e); });
  const meta=new Map();
  Object.entries(groups).forEach(([k,list])=>{
    const [idA,idB]=k.split('~'); const A=sim.nodeById[idA], B=sim.nodeById[idB];
    const dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||1; const perp={x:-dy/d, y:dx/d};  // ペアで固定の垂直方向
    list.forEach((e,i)=> meta.set(e,{i,n:list.length,perp}));
  });
  const defs=`<defs><marker id="rel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>`;
  let edgesSvg="";
  sim.edges.forEach(e=>{
    const p=e.from, q=e.to; const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    const sx=p.x+ux*R, sy=p.y+uy*R, ex=q.x-ux*R, ey=q.y-uy*R;              // ノード縁で止めて矢印を見せる
    const {i,n,perp}=meta.get(e); const off=(i-(n-1)/2)*26;
    let mx,my;
    if(!off){
      edgesSvg+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="var(--text-2)" stroke-width="1.5" opacity=".55" marker-end="url(#rel-arrow)"/>`;
      mx=(sx+ex)/2; my=(sy+ey)/2;
    } else {
      const cx=(p.x+q.x)/2+perp.x*off*2, cy=(p.y+q.y)/2+perp.y*off*2;
      edgesSvg+=`<path d="M${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="var(--text-2)" stroke-width="1.5" opacity=".55" marker-end="url(#rel-arrow)"/>`;
      mx=(p.x+q.x)/2+perp.x*off; my=(p.y+q.y)/2+perp.y*off;
    }
    const text = _relMode==='call' ? (e.r.call||'') : (e.r.label||'');
    if(text){ const w=text.length*8+10;
      edgesSvg+=`<rect x="${mx-w/2}" y="${my-9}" width="${w}" height="18" rx="4" fill="var(--surface)" stroke="var(--border)"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="11" fill="var(--text)">${esc(text)}</text>`;
    }
  });
  let nodesSvg="";
  sim.nodes.forEach(n=>{ const c=n.c;
    nodesSvg+=`<g class="rel-node" data-id="${n.id}"><circle cx="${n.x}" cy="${n.y}" r="22" fill="${c.color||'#888'}"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style="pointer-events:none">${esc((c.name||"?").slice(0,2))}</text><text x="${n.x}" y="${n.y+38}" text-anchor="middle" font-size="12" fill="var(--text)" style="pointer-events:none">${esc(c.name)}</text></g>`;
  });
  sim.svg.innerHTML=defs+edgesSvg+nodesSvg;
}
function setupRelDrag(sim){
  const svg=sim.svg;
  const toSvg=(ev)=>{ const r=svg.getBoundingClientRect(); return { x:(ev.clientX-r.left)/r.width*sim.W, y:(ev.clientY-r.top)/r.height*sim.H }; };
  svg.onpointerdown=(ev)=>{ const g=ev.target.closest('.rel-node'); if(!g)return; const n=sim.nodeById[g.dataset.id]; if(!n)return;
    sim.drag=n; const p=toSvg(ev); sim.dragX=p.x; sim.dragY=p.y; try{svg.setPointerCapture(ev.pointerId);}catch(e){} ev.preventDefault(); };
  svg.onpointermove=(ev)=>{ if(!sim.drag)return; const p=toSvg(ev); sim.dragX=p.x; sim.dragY=p.y;
    if(sim.reduced){ sim.drag.x=p.x; sim.drag.y=p.y; for(let k=0;k<6;k++) stepRel(sim); drawRel(sim); } };
  svg.onpointerup=svg.onpointercancel=()=>{ if(sim.reduced && sim.drag){ for(let k=0;k<60;k++) stepRel(sim); drawRel(sim); } sim.drag=null; };
}

        closeModal();

let _msCurrentChapter = null;
function manuscript(){ const d=cur(); if(!d.manuscript) d.manuscript={chapters:[]}; return d.manuscript; }
function msCountChars(body){   // 本文の文字数（ルビ記法のよみ・記号は除外、親文字はカウント）
  let s = (body||"")
    .replace(/｜([^《]+)《[^》]+》/g, '$1')
    .replace(/([一-龠々〆ヵヶ]+)《[^》]+》/g, '$1');

// 青空文庫形式のルビを <ruby> に変換（｜親文字《ルビ》 と 漢字《ルビ》）
function renderRuby(text){
  let s = esc(text);
  s = s.replace(/｜([^《]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  s = s.replace(/([一-龠々〆ヵヶ]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  return s;
}
function bodyToVertHtml(text){
  const h=(text||"").split(/\n/).map(line=> line.trim()==="" ? "<br>" : `<p>${renderRuby(line)}</p>`).join("");

}

function scrollVertToCaret(){
  if(!_vprev) return;
  const body=document.getElementById("msBody"), live=document.getElementById("msVertLive"); if(!body||!live) return;
  const lineIdx=(body.value.slice(0,body.selectionStart).match(/\n/g)||[]).length;
  const el=live.children[lineIdx]||live.lastElementChild; if(!el) return;
  const er=el.getBoundingClientRect(), lr=live.getBoundingClientRect();
  if(er.left < lr.left+8) live.scrollLeft -= (lr.left - er.left) + 24;
  else if(er.right > lr.right-8) live.scrollLeft += (er.right - lr.right) + 24;
}

function tokenizeRuby(line){
  const tokens=[]; const re=/｜([^《]+)《([^》]+)》|([一-龠々〆ヵヶ]+)《([^》]+)》/g; let m, last=0;
  while((m=re.exec(line))){
    for(const ch of line.slice(last,m.index)) tokens.push({base:ch,yomi:null});
    if(m[1]!=null) tokens.push({base:m[1],yomi:m[2]}); else tokens.push({base:m[3],yomi:m[4]});
    last=re.lastIndex;
  }
  for(const ch of line.slice(last)) tokens.push({base:ch,yomi:null});
  return tokens;
}
function tokensToHtml(tokens){
  return tokens.map(t=> t.yomi? `<ruby>${esc(t.base)}<rt>${esc(t.yomi)}</rt></ruby>` : esc(t.base)).join("");
}
function buildBlocks(){
  const blocks=[];
  for(const ch of manuscript().chapters){
    blocks.push({type:'chapter', text:ch.title||'無題'});
    for(const ln of (ch.body||"").split(/\n/)) blocks.push({type:'para', tokens: ln===""? [] : tokenizeRuby(ln)});
  }
  return blocks;
}
function makePageEl(opts, sz, pageNum, workTitle){
  const page=document.createElement('div'); page.className='book-page';
  page.style.width=sz.w+"mm"; page.style.height=sz.h+"mm";
  const odd = pageNum%2===1;                       // 右綴じ: 奇数=右ページ(のど=右)
  const left = (odd? opts.mOuter : opts.mInner)+"mm";
  const right= (odd? opts.mInner : opts.mOuter)+"mm";
  const body=document.createElement('div'); body.className='bk-body';
  body.style.top=opts.mTop+"mm"; body.style.bottom=opts.mBottom+"mm"; body.style.left=left; body.style.right=right;
  body.style.fontSize=opts.fontPt+"pt"; body.style.lineHeight=opts.lineH;
  page.appendChild(body);
  if(opts.kashira && workTitle){ const k=document.createElement('div'); k.className='bk-kashira'; k.textContent=workTitle; page.appendChild(k); }
  if(opts.nombre){ const n=document.createElement('div'); n.className='bk-nombre'; n.textContent=pageNum; page.appendChild(n); }
  return {page, body};
}
function applyPageCSS(sz){
  let st=document.getElementById("bookPageCSS");
  if(!st){ st=document.createElement('style'); st.id="bookPageCSS"; document.head.appendChild(st); }
  st.textContent=`@media print{ @page{ size:${sz.w}mm ${sz.h}mm; margin:0 } }`;
}
function renderBook(){
  const opts=loadBookSettings(); const sz=BOOK_SIZES[opts.size]||BOOK_SIZES.a5;
  applyPageCSS(sz);
  const host=document.getElementById("bookPrint"); host.innerHTML="";
  const title=curProject().title||"";
  const blocks=buildBlocks();
  let page, body;
  const newPage=()=>{ const r=makePageEl(opts,sz,host.children.length+1,title); host.appendChild(r.page); page=r.page; body=r.body; };
  const overflow=()=>body.scrollWidth > body.clientWidth + 1;      // 縦書きは左へあふれる
  newPage();
  for(const blk of blocks){
    if(blk.type==='chapter'){
      if(opts.chapterNewPage && body.childNodes.length) newPage();
      const h=document.createElement('div'); h.className='bk-chap'; h.textContent=blk.text; body.appendChild(h);
      if(overflow()){ body.removeChild(h); newPage(); body.appendChild(h); }
      continue;
    }
    if(blk.tokens.length===0){ const p=document.createElement('p'); p.className='bk-p'; p.innerHTML='<br>'; body.appendChild(p); if(overflow()){ body.removeChild(p); newPage(); } continue; }
    const pFull=document.createElement('p'); pFull.className='bk-p'; pFull.innerHTML=tokensToHtml(blk.tokens); body.appendChild(pFull);
    if(!overflow()) continue;
    body.removeChild(pFull);
    let rest=blk.tokens.slice();
    while(rest.length){
      const p=document.createElement('p'); p.className='bk-p'; body.appendChild(p);
      p.innerHTML=tokensToHtml(rest);
      if(!overflow()){ rest=[]; break; }
      let lo=1, hi=rest.length, fit=0;
      while(lo<=hi){ const mid=(lo+hi)>>1; p.innerHTML=tokensToHtml(rest.slice(0,mid)); if(overflow()) hi=mid-1; else { fit=mid; lo=mid+1; } }
      if(fit===0){ // ページが空でも1字入らない=異常。無限ループ防止に最低1字
        if(body.querySelectorAll('.bk-p,.bk-chap').length<=1){ p.innerHTML=tokensToHtml(rest.slice(0,1)); rest=rest.slice(1); if(rest.length) newPage(); continue; }
        body.removeChild(p); newPage(); continue;
      }
      p.innerHTML=tokensToHtml(rest.slice(0,fit)); rest=rest.slice(fit);
      if(rest.length) newPage();
    }
  }
  document.getElementById("bookInfo").textContent = `${sz.label}・${host.children.length}ページ`;
}

function cmdTypeLabel(t){ return {line:"セリフ",narration:"地の文",choice:"選択肢",set:"変数",if:"条件分岐"}[t]||t; }

  return v.type==='flag' ? `${esc(v.name)}${SET_OP_FLAG[cmd.op]||''}` : `${esc(v.name)} ${SET_OP_NUM[cmd.op]||'='} ${esc(String(cmd.value??0))}`; }
function ifSummary(cmd){ const v=varById(cmd.varId); if(!v) return "(変数未設定)";
  return v.type==='flag' ? `${esc(v.name)}${CMP_FLAG[cmd.cmp]||''}` : `${esc(v.name)}${CMP_NUM[cmd.cmp]||''}${esc(String(cmd.value??0))}`; }
function cmdSummary(cmd){

function buildCmdRow(cmd, list){

function openFlow(){
  openModal(`<div class="menu-head"><span class="menu-title">分岐フロー図</span><button class="menu-x" data-close title="閉じる">✕</button></div>
    <div class="flow-wrap"><svg id="flowSvg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet"></svg></div>
    <p class="muted" style="font-size:12px;margin:8px 2px 0">実線＝選択肢の飛び先 / 点線＝「次のシーン」。</p>`);
  const modal=document.querySelector(".overlay .modal"); if(modal) modal.style.maxWidth="820px";
  drawFlow();
}
function drawFlow(){
  const svg=document.getElementById("flowSvg"); if(!svg)return;
  const scenes=scenario().scenes; const W=800,H=520;
  const n=scenes.length||1; const cols=Math.ceil(Math.sqrt(n)); const rows=Math.ceil(n/cols);
  const cw=W/cols, ch=H/rows; const pos={};
  scenes.forEach((s,i)=>{ const r=Math.floor(i/cols), c=i%cols; pos[s.id]={x:c*cw+cw/2, y:r*ch+ch/2}; });
  let defs=`<defs><marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>`;
  // ネストしたコマンド(選択肢の続き・条件分岐)も辿ってジャンプを収集
  const jumps=[];
  const scan=(cmds,fromId)=>{ (cmds||[]).forEach(c=>{
    if(c.type==='choice'){ (c.options||[]).forEach(o=>{ if(o.to) jumps.push({from:fromId,to:o.to,kind:'choice'}); else scan(o.commands,fromId); }); }
    else if(c.type==='if'){ scan(c.then,fromId); scan(c.else,fromId); }
  }); };
  scenes.forEach(s=>{ scan(s.commands,s.id); if(s.next) jumps.push({from:s.id,to:s.next,kind:'next'}); });
  let edges="", nodes="";
  jumps.forEach(j=>{ if(j.to===j.from||!pos[j.to]||!pos[j.from])return; const p=pos[j.from],q=pos[j.to];
    const dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    const x1=p.x+ux*56,y1=p.y+uy*22,x2=q.x-ux*58,y2=q.y-uy*24;
    const dash=j.kind==='next'?' stroke-dasharray="5 4"':'';
    edges+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--text-2)" stroke-width="1.5" opacity=".6"${dash} marker-end="url(#fl-arrow)"/>`;
  });
  scenes.forEach(s=>{ const p=pos[s.id]; const label=(s.title||'無題');
    nodes+=`<g><rect x="${p.x-54}" y="${p.y-18}" width="108" height="36" rx="5" fill="var(--primary-weak)" stroke="var(--primary)"/>
      <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="12" fill="var(--text)">${esc(label.length>8?label.slice(0,8)+'…':label)}</text></g>`;
  });
  svg.innerHTML=defs+edges+nodes;
}

// ============================ モーダル ============================
function openModal(html, onReady, opts){
  const host=document.getElementById("overlayHost");
  host.innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`;
  const ov=host.querySelector(".overlay");
  if(!(opts&&opts.dismissible===false)) ov.addEventListener("click",e=>{ if(e.target===ov) closeModal(); });  // dismissible:falseで外クリック閉じ無効
  host.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  if(onReady) onReady(host.querySelector(".modal"));
  const f=host.querySelector("input,textarea,select"); if(f) f.focus();
}
function closeModal(){ document.getElementById("overlayHost").innerHTML=""; }
// 短い通知（トースト）＝ブラウザのalertの置き換え。モーダルを開いたままでも出せる。
// kind:"err" で赤系。クリック or 数秒で自動的に消える。読ませたい長文は noticeModal を使う。
function toast(msg, kind){
  const s = String(msg==null ? "" : msg);
  let host = document.getElementById("toastHost");
  if(!host){ host=document.createElement("div"); host.id="toastHost"; document.body.appendChild(host); }
  const t = document.createElement("div");
  t.className = "toast" + (kind==="err" ? " err" : "");
  t.setAttribute("role", kind==="err" ? "alert" : "status");
  t.textContent = s;
  host.appendChild(t);
  while(host.children.length > 3) host.firstChild.remove();   // 溜まりすぎ防止（古いものから消す）
  let gone=false;
  const bye=()=>{ if(gone) return; gone=true;
    if(prefersReduced()){ t.remove(); return; }
    const a=t.animate([{opacity:1},{opacity:0,transform:"translateY(6px)"}],{duration:170,easing:"ease-in",fill:"forwards"});
    a.onfinish=()=>t.remove(); };
  t.onclick=bye;
  setTimeout(bye, Math.min(7000, 2500 + s.length*50));   // 長い文ほど長めに出す
  if(!prefersReduced()) t.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],
    {duration:170,easing:"cubic-bezier(.2,.7,.3,1)"});
  return t;
}
// 例外などの生テキストを noticeModal の本文HTMLにする（エスケープ＋改行を<br>へ）
function escBr(s){ return esc(String(s==null ? "" : s)).replace(/\n/g,"<br>"); }
// 確認ダイアログ（ブラウザのconfirmの置き換え）。await すると true / false が返る。
// openModal とは別の重ね用ホストに出すので、編集モーダルを開いたまま確認できる。
// → キャンセルすると元の編集モーダルがそのまま残る（確認を挟んでも編集中の内容を失わない）
// 外クリック・Esc もキャンセル扱いで false。
function confirmDialog(title, msgHtml, okLabel, kind){
  return new Promise(resolve=>{
    let host=document.getElementById("confirmHost");
    if(!host){ host=document.createElement("div"); host.id="confirmHost"; document.body.appendChild(host); }
    host.innerHTML=`<div class="overlay overlay-2"><div class="modal" style="max-width:430px">
      <h3>${esc(title)}</h3>
      <p class="modal-msg">${msgHtml}</p>
      <div class="modal-actions">
        <button class="btn" id="cfNo">キャンセル</button>
        <button class="btn ${kind==="plain"?"primary":"danger"}" id="cfYes">${esc(okLabel||"削除する")}</button>
      </div></div></div>`;
    let done=false;
    const finish=(v)=>{ if(done) return; done=true;
      document.removeEventListener("keydown", onKey, true);
      host.innerHTML="";
      resolve(!!v); };
    const onKey=(e)=>{ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); finish(false); } };
    const ov=host.querySelector(".overlay");
    ov.addEventListener("click", e=>{ if(e.target===ov) finish(false); });
    host.querySelector("#cfYes").onclick=()=>finish(true);
    host.querySelector("#cfNo").onclick=()=>finish(false);
    document.addEventListener("keydown", onKey, true);
    setTimeout(()=>{ const b=document.getElementById("cfYes"); if(b) b.focus(); }, 0);
  });
}
// ---- 検索（この作品内を横断検索） ----
function searchProject(q){
  q=(q||"").trim().toLowerCase(); const d=cur(); if(!q||!d) return [];
  const hit=s=>(s||"").toLowerCase().includes(q); const res=[];
  (d.characters||[]).forEach(c=>{ if(hit(c.name)||(c.fields||[]).some(f=>hit(f.k)||hit(f.v))||(c.tags||[]).some(hit)) res.push({type:'character',id:c.id,label:c.name||'(無名)',sub:'キャラ'}); });
  (d.world||[]).forEach(w=>{ if(hit(w.title)||hit(w.body)||hit(w.category)||(w.tags||[]).some(hit)) res.push({type:'world',id:w.id,label:w.title||'(無題)',sub:'世界観'}); });
  ((d.plot&&d.plot.cards)||[]).forEach(c=>{ if(hit(c.title)||hit(c.body)||(c.tags||[]).some(hit)) res.push({type:'plot',id:c.id,label:c.title||'(無題)',sub:'プロット'}); });
  (d.timeline||[]).forEach(e=>{ if(hit(e.when)||hit(e.title)||hit(e.body)) res.push({type:'timeline',id:e.id,label:e.title||'(無題)',sub:'年表'}); });
  (d.relations||[]).forEach(r=>{ const a=(d.characters||[]).find(c=>c.id===r.from),b=(d.characters||[]).find(c=>c.id===r.to);
    if(hit(r.label)||hit(r.call)||(a&&hit(a.name))||(b&&hit(b.name))) res.push({type:'relation',id:r.id,label:`${a?a.name:'?'} → ${b?b.name:'?'}（${r.label||''}${r.call?' / 「'+r.call+'」と呼ぶ':''}）`,sub:'相関図'}); });
  ((d.manuscript&&d.manuscript.chapters)||[]).forEach(ch=>{ if(hit(ch.title)||hit(ch.body)) res.push({type:'chapter',id:ch.id,label:ch.title||'(無題)',sub:'原稿'}); });
  ((d.scenario&&d.scenario.scenes)||[]).forEach(s=>{ let m=hit(s.title);
    if(!m){ const sc=cmds=>(cmds||[]).some(c=>hit(c.text)||hit(c.speaker)||(c.options||[]).some(o=>hit(o.text)||sc(o.commands))||sc(c.then)||sc(c.else)); m=sc(s.commands); }
    if(m) res.push({type:'scene',id:s.id,label:s.title||'(無題)',sub:'シナリオ'}); });
  (d.memos||[]).forEach(m=>{ if(hit(m.title)||hit(m.body)||(m.tags||[]).some(hit)) res.push({type:'memo',id:m.id,label:m.title||(m.body||'').slice(0,24)||'(空メモ)',sub:'メモ'}); });
  return res;
}
function jumpToResult(r){
  closeModal();
  const setTab=v=>{ currentView=v; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x.dataset.view===v)); renderView(); };
  if(r.type==='character'){ setTab('characters'); editCharacter(r.id); }
  else if(r.type==='world'){ setTab('world'); editWorld(r.id); }
  else if(r.type==='plot'){ setTab('plot'); editPlotCard(r.id); }
  else if(r.type==='timeline'){ setTab('timeline'); editTimelineEvent(r.id); }
  else if(r.type==='relation'){ setTab('relations'); editRelation(r.id); }
  else if(r.type==='chapter'){ _msCurrentChapter=r.id; setTab('manuscript'); }
  else if(r.type==='scene'){ _scCurScene=r.id; setTab('scenario'); }
  else if(r.type==='memo'){ _flashId=r.id; setTab('memo'); }
}
function openSearch(){
  if(!curProject()){ toast("先に作品を作成してください","err"); return; }
  openModal(`<div class="menu-head"><span class="menu-title">検索（この作品内）</span><button class="menu-x" data-close title="閉じる">✕</button></div>
    <div class="field"><input id="srchInput" placeholder="キャラ・世界観・本文・メモなどを検索…" autocomplete="off"></div>
    <div class="srch-results" id="srchResults"><div class="muted" style="font-size:13px;padding:6px 2px">キーワードを入力してください。</div></div>`,
    (root)=>{
      const inp=root.querySelector("#srchInput"), host=root.querySelector("#srchResults");
      inp.oninput=()=>{ const q=inp.value; const res=searchProject(q);
        if(!q.trim()){ host.innerHTML=`<div class="muted" style="font-size:13px;padding:6px 2px">キーワードを入力してください。</div>`; return; }
        if(!res.length){ host.innerHTML=`<div class="muted" style="font-size:13px;padding:6px 2px">該当なし</div>`; return; }
        host.innerHTML=res.map((r,i)=>`<button class="srch-item" data-i="${i}"><span class="srch-type">${r.sub}</span><span class="srch-label">${esc(r.label)}</span></button>`).join("");
        host.querySelectorAll(".srch-item").forEach(b=>{ b.onclick=()=>jumpToResult(res[+b.dataset.i]); });
      };
    });
  const modal=document.querySelector(".overlay .modal"); if(modal) modal.style.maxWidth="560px";
}

// 作品の削除：ブラウザのconfirmではなく自前のダイアログ。取り違え防止に作品名の入力を求める
function openDeleteProject(p){
  if(p.shared && fbUser && p.ownerUid!==fbUser.uid){
    noticeModal("共有作品です", "この作品はほかの人のものです。自分の端末から外すには<b>「共同編集を管理」→「この作品から抜ける」</b>を使ってください。");
    return;
  }
  const title = p.title || "";
  const sharedOwner = p.shared && fbUser && p.ownerUid===fbUser.uid;
  openModal(`<h3>作品を削除</h3>
    <p class="modal-msg gap">作品「<b>${esc(title)}</b>」を削除します。
      キャラクター・原稿・プロットなど<b>この作品の中身もすべて消えます</b>。<br>
      <span class="muted">元に戻せません。${sharedOwner?"共有中のため、協力者全員からも消えます。":""}${p.encrypted?"暗号化作品のため、復元キーがあっても戻せません。":""}</span></p>
    <div class="field"><label>確認のため作品名を入力してください</label>
      <input id="delName" placeholder="${esc(title)}" autocomplete="off" spellcheck="false"></div>
    <div class="modal-actions">
      <button class="btn" data-close>キャンセル</button>
      <button class="btn danger" id="delGo" disabled>削除する</button>
    </div>`, (root)=>{
      const inp=root.querySelector("#delName"), go=root.querySelector("#delGo");
      const match=()=>inp.value.trim()===title.trim();
      inp.addEventListener("input", ()=>{ go.disabled=!match(); });

      go.onclick=()=>{ if(match()) deleteProjectNow(p); };
      setTimeout(()=>inp.focus(), 0);
    });

// この端末から作品を取り除く（ロック中データの消し忘れ防止に1か所へ）
function forgetProject(id){
  delete state.data[id]; delete _locked[id];
  state.projects = state.projects.filter(x=>x.id!==id);
  state.currentId = state.projects[0]?.id || null;
}
function deleteProjectNow(p){
  const delId=p.id;
  // 削除先はログイン時だけ必要（未ログインで projectsCol() を呼ぶと fbUser が null で落ちる）
  const ref = (fbUser && fbDb) ? (p.shared ? worksCol().doc(delId) : projectsCol().doc(delId)) : null;
  forgetProject(delId);
  save(); if(ref) deleteRemote(delId, ref);
  closeModal(); renderAll();
}

// 作品をJSONで書き出し（本体＝state.data[id] 全体＝章本文も含む。将来のインポート/移行用）
function buildProjectExport(p){
  return JSON.stringify({ app:"fabula", type:"project", version:1, exportedAt:new Date().toISOString(), title:p.title, data:state.data[p.id] }, null, 2);
}
function exportProject(p){
  if(!isFull()) return;   // エクスポートは支援者限定
  if(!p || !state.data[p.id]){ toast("エクスポートする作品がありません","err"); return; }
  const blob=new Blob([buildProjectExport(p)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=((p.title||"fabula").replace(/[\/\\:*?"<>|\s]+/g,"_").slice(0,60)||"fabula")+".fabula.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// 共有リンク（暗号化作品は復号鍵を # 以降に載せる＝サーバー非送信）
function shareLink(p){
  let url = location.origin + "/#join=" + encodeURIComponent(p.id);
  if(p.encrypted && _keyStrs[p.id]) url += "&k=" + encodeURIComponent(_keyStrs[p.id]);
  return url;
}
// この作品を共有化（works/{id} へ移動＋所有権付与）→ 共有リンクを表示
async function shareProject(p){
  if(!fbUser){ noticeModal("ログインが必要です", '共同編集はクラウド保存を使うため、ログインが必要です。<br><span class="muted">☰メニューから「Discordでログイン」してください。</span>'); return; }
  if(p.encrypted){ const key=await getKey(p.id); if(!key){ noticeModal("ロック中です", 'この作品は暗号化されています。<br><span class="muted">先にロックを解除してから共有してください。</span>'); return; } }
  const prev = { shared:p.shared, ownerUid:p.ownerUid, members:p.members, inviteOpen:p.inviteOpen };
  p.shared=true; p.ownerUid=fbUser.uid; p.members=[fbUser.uid]; p.inviteOpen=true;
  try{
    const doc = await cloudDoc(p.id); if(!doc) throw new Error("作品データを準備できません");
    await worksCol().doc(p.id).set(doc);
    await pushChapters(p.id, chapCol(p.id));
    await deleteRemote(p.id, projectsCol().doc(p.id));   // 旧・非共有コピーを削除
    saveLocal(); startLiveSync(); renderProjectBar();
    openShareManage(p);
  }catch(e){
    Object.assign(p, prev); saveLocal();   // 失敗したら非共有へ戻す（半端な共有状態を残さない）
    noticeModal("共有を開始できませんでした", escBr(e.message||e) + '<br><span class="muted">Firestoreルールのデプロイがまだの可能性があります。</span>');
  }
}
// 共有をやめて非公開(private)へ戻す（owner のみ）
async function unshareProject(p){
  if(!fbUser || p.ownerUid!==fbUser.uid) return;
  if(!await confirmDialog("共有をやめる", "この作品を非公開（自分だけ）に戻します。<br><span class=\"muted\">協力者はアクセスできなくなります。</span>", "共有をやめる")) return;
  try{
    const doc = await cloudDoc(p.id);
    if(doc){ delete doc.ownerUid; delete doc.members; delete doc.inviteOpen;   // 共有用の3項目を落とせば非共有の形になる
      const pref=projectsCol().doc(p.id);
      await pref.set(doc);
      await pushChapters(p.id, pref.collection("chapters"));
    }
    await deleteRemote(p.id, worksCol().doc(p.id));        // works 側を削除
    p.shared=false; p.ownerUid=null; p.members=null; p.inviteOpen=true;
    stopLiveSync(); saveLocal(); closeModal(); renderAll();
  }catch(e){ noticeModal("共有解除に失敗しました", escBr(e.message||e)); }
}
// 共有作品から抜ける（member）
async function leaveProject(p){
  if(!fbUser) return;
  if(!await confirmDialog("共有作品から抜ける", "この作品から抜けます。<br><span class=\"muted\">自分の端末からも消えます。オーナーが共有している限り、リンクから入り直せます。</span>", "抜ける")) return;
  try{ await worksCol().doc(p.id).update({ members:(p.members||[]).filter(x=>x!==fbUser.uid) }); }catch(e){ console.warn("[Fabula] 退出失敗:", e); }
  stopLiveSync();
  forgetProject(p.id);
  saveLocal(); closeModal(); renderAll();
}
async function removeMember(p, uid){
  if(!fbUser || p.ownerUid!==fbUser.uid || uid===p.ownerUid) return;
  const next=(p.members||[]).filter(x=>x!==uid);
  try{ await worksCol().doc(p.id).update({ members: next }); p.members=next; saveLocal(); openShareManage(p); }
  catch(e){ toast("メンバー削除に失敗しました: "+(e.message||e), "err"); }
}
async function toggleInvite(p){
  if(!fbUser || p.ownerUid!==fbUser.uid) return;
  const next = !(p.inviteOpen!==false);
  try{ await worksCol().doc(p.id).update({ inviteOpen: next }); p.inviteOpen=next; saveLocal(); openShareManage(p); }

// インポート用の正規化：空テンプレに重ねて、無い項目はデフォルト補完・未知の項目は無視・型違いは既定へ。
// → 将来フィールドが増えても古いファイルを読み込める（構造を大きく変える時は version を見て変換を足す）。
function normalizeProjectData(data){
  const base=emptyProjectData();
  if(!data || typeof data!=="object") return base;
  const out={...base};
  for(const k of ["characters","world","timeline","relations","memos"]) if(Array.isArray(data[k])) out[k]=data[k];
  if(data.plot && typeof data.plot==="object")
    out.plot={ structure:data.plot.structure||base.plot.structure, cards:Array.isArray(data.plot.cards)?data.plot.cards:[], chapters:Array.isArray(data.plot.chapters)?data.plot.chapters:[] };
  if(data.manuscript && Array.isArray(data.manuscript.chapters))
    out.manuscript={ chapters:data.manuscript.chapters };
  if(data.scenario && typeof data.scenario==="object")
    out.scenario={ scenes:Array.isArray(data.scenario.scenes)?data.scenario.scenes:[], vars:Array.isArray(data.scenario.vars)?data.scenario.vars:[] };
  if(data.tabVis && typeof data.tabVis==="object") out.tabVis=data.tabVis;   // タブ表示設定も引き継ぐ
  if(Array.isArray(data.charTemplate)) out.charTemplate=data.charTemplate;   // キャラ項目テンプレートも引き継ぐ
  return out;
}
function importProject(){
  if(!isFull()) return;   // インポートは支援者限定
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files && inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=async ()=>{
      let obj; try{ obj=JSON.parse(r.result); }catch(e){ noticeModal("読み込めません", "ファイルを読み取れませんでした。JSON形式ではないかもしれません。"); return; }
      if(obj && obj.app && obj.app!=="fabula"){
        if(!await confirmDialog("読み込みますか？", "Fabula以外のファイルの可能性があります。<br><span class=\"muted\">内容が正しく読み込めないことがあります。</span>", "読み込む", "plain")) return; }
      if(!guardAdd('projects', state.projects.length)) return;   // 体験版の作品数制限
      const data=normalizeProjectData(obj && obj.data ? obj.data : obj);
      const title=((obj && obj.title) ? String(obj.title) : "読み込んだ作品").slice(0,80) || "読み込んだ作品";
      createProject(title, data); _tagFilter=null; save(); renderAll(); animateMain();
      toast(`「${title}」をインポートしました`);
    };
    r.readAsText(f);
  };
  inp.click();
}
