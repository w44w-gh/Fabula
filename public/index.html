<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fabula</title>
<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f4f5f5; --surface:#ffffff; --surface-2:#ececee; --text:#17191c; --text-2:#6b7075;
    --border:#e1e2e4; --primary:#0e8c7f; --primary-weak:#dcefeb; --on-primary:#ffffff; --danger:#d2473d;
    --shadow:0 1px 2px rgba(20,25,30,.05);
    --radius:5px;
  }
  :root[data-theme="dark"]{
    --bg:#131517; --surface:#1b1e20; --surface-2:#24282b; --text:#e9eaeb; --text-2:#9aa0a4;
    --border:#30353a; --primary:#15a394; --primary-weak:#10302b; --on-primary:#06201c; --danger:#ff6b6f;
    --shadow:0 1px 3px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131517; --surface:#1b1e20; --surface-2:#24282b; --text:#e9eaeb; --text-2:#9aa0a4;
      --border:#30353a; --primary:#15a394; --primary-weak:#10302b; --on-primary:#06201c; --danger:#ff6b6f;
      --shadow:0 1px 3px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);
    border:1px solid var(--border);border-radius:4px;padding:8px 10px;width:100%}
  textarea{resize:vertical;min-height:70px;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}

  /* ---- header ---- */
  header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:17px;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
  .logo .mark{width:22px;height:22px;border-radius:3px;background:var(--primary);
    display:inline-block}
  .spacer{flex:1}
  .proj-select{max-width:230px}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:4px;
    padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.icon{padding:8px;width:36px;justify-content:center}
  .btn.subtle{border-color:transparent;background:transparent;color:var(--text-2)}
  .btn.subtle:hover{background:var(--surface-2);color:var(--text)}
  .btn.danger{color:var(--danger);border-color:var(--danger)}

  /* ---- nav ---- */
  nav.tabs{display:flex;gap:4px;padding:8px 14px 0;background:var(--surface);border-bottom:1px solid var(--border);
    position:sticky;top:55px;z-index:15;overflow-x:auto}
  nav.tabs button{border:none;background:none;color:var(--text-2);padding:9px 14px;font-size:14px;font-weight:600;
    border-bottom:2.5px solid transparent;white-space:nowrap}
  nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}

  main{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
  .view-head{display:flex;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
  .view-head h2{font-size:18px;margin:0}
  .muted{color:var(--text-2)}
  .empty{text-align:center;color:var(--text-2);padding:60px 16px}
  .empty .big{font-size:15px;margin-bottom:14px}

  /* ---- cards grid (characters) ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;cursor:pointer;transition:transform .08s}
  .card:hover{transform:translateY(-2px)}
  .char-top{display:flex;gap:11px;padding:13px}
  .avatar{width:54px;height:54px;border-radius:5px;flex-shrink:0;object-fit:cover;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px}
  .char-name{font-weight:700;font-size:15px}
  .char-fields{font-size:12px;color:var(--text-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* ---- plot lanes ---- */
  .lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
  .lane{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
  .lane h3{margin:2px 4px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
  .lane h3 .dot{width:9px;height:9px;border-radius:50%}
  .plot-card{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:10px;margin-bottom:8px}
  .plot-card .t{font-weight:700;font-size:13.5px}
  .plot-card .b{font-size:12.5px;color:var(--text-2);margin-top:4px;white-space:pre-wrap}
  .plot-card .row{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
  .mini{border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:3px 7px;font-size:12px;color:var(--text-2)}
  .mini:hover{background:var(--surface-2);color:var(--text)}
  .add-card{width:100%;border:1px dashed var(--border);background:transparent;color:var(--text-2);border-radius:5px;padding:9px;font-size:13px;font-weight:600}
  .add-card:hover{border-color:var(--primary);color:var(--primary)}

  /* ---- world ---- */
  .world-cat{margin-bottom:22px}
  .world-cat h3{font-size:14px;color:var(--primary);border-bottom:1px solid var(--border);padding-bottom:6px;margin:0 0 10px}
  .world-item{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:12px;margin-bottom:9px}
  .world-item .t{font-weight:700;font-size:14px}
  .world-item .b{font-size:13px;color:var(--text-2);margin-top:4px;white-space:pre-wrap}
  .world-item .row{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}

  /* ---- relations ---- */
  .rel-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  #relSvg{width:100%;height:420px;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:
    radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 0) 0 0/22px 22px}
  .rel-node{cursor:grab}
  .rel-node:active{cursor:grabbing}
  .rel-list{margin-top:14px;display:flex;flex-direction:column;gap:7px}
  .rel-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:5px;padding:9px 11px;font-size:13.5px}
  .rel-row .lbl{flex:1;color:var(--text-2)}

  /* ---- timeline ---- */
  .timeline{margin-top:4px}
  .tl-item{display:flex;gap:12px;align-items:stretch}
  .tl-when{flex:0 0 96px;text-align:right;font-size:12px;font-weight:700;color:var(--primary);padding-top:12px;word-break:break-word}
  .tl-mid{position:relative;flex:0 0 16px}
  .tl-mid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--border);transform:translateX(-50%)}
  .tl-item:first-child .tl-mid::before{top:14px}
  .tl-item:last-child .tl-mid::before{bottom:calc(100% - 14px)}
  .tl-dot{position:absolute;left:50%;top:14px;width:12px;height:12px;border-radius:50%;background:var(--primary);
    transform:translateX(-50%);border:2px solid var(--surface);z-index:1}
  .tl-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:11px 12px;margin-bottom:10px}
  .tl-card .t{font-weight:700;font-size:14px}
  .tl-card .b{font-size:13px;color:var(--text-2);margin-top:4px;white-space:pre-wrap}
  .tl-chars{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tl-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:3px;padding:2px 9px 2px 6px}
  .tl-chip .cd{width:9px;height:9px;border-radius:50%}
  .tl-card .row{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}
  .char-check{display:flex;flex-wrap:wrap;gap:6px}
  .char-check label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--border);
    border-radius:3px;padding:4px 10px;cursor:pointer}
  .char-check input{width:auto}
  .char-check input:checked + span{font-weight:700;color:var(--primary)}

  /* ---- modal ---- */
  @keyframes ovFade{from{opacity:0}to{opacity:1}}
  @keyframes mdPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .overlay{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:70;display:flex;align-items:center;
    justify-content:center;padding:16px;animation:ovFade .14s ease-out}
  .modal{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);width:100%;max-width:540px;
    max-height:90vh;overflow:auto;padding:20px;animation:mdPop .18s cubic-bezier(.2,.7,.3,1)}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important} }
  .modal h3{margin:0 0 16px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:5px}
  .field-row{display:flex;gap:7px;margin-bottom:7px;align-items:center}
  .field-row input:first-child{flex:0 0 34%}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  /* ---- ☰ menu (account) ---- */
  .menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
  .menu-title{font-size:12px;font-weight:700;color:var(--text-2)}
  .menu-x{border:none;background:none;color:var(--text-2);font-size:15px;line-height:1;padding:5px;border-radius:4px}
  .menu-x:hover{background:var(--surface-2);color:var(--text)}
  .menu-acct{display:flex;align-items:center;gap:12px}
  .menu-avatar{width:42px;height:42px;border-radius:5px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--on-primary);font-size:16px;background:var(--primary)}
  .menu-avatar.guest{background:var(--surface-2);color:var(--text-2)}
  .menu-acct-txt{flex:1;min-width:0}
  .menu-acct-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-acct-sub{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px;margin-top:2px}
  .menu-sep{height:1px;background:var(--border);margin:15px 0}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:var(--text);
    padding:10px;border-radius:5px;font-size:14px;font-weight:600;text-align:left}
  .menu-item:hover{background:var(--surface-2)}
  .menu-item.danger{color:var(--danger)}
  .menu-item.danger:hover{background:rgba(229,72,77,.12)}
  /* ---- manuscript (原稿) ---- */
  .ms-wrap{display:flex;gap:14px;align-items:flex-start}
  .ms-side{flex:0 0 212px;display:flex;flex-direction:column;gap:8px}
  .ms-chaps{display:flex;flex-direction:column;gap:5px}
  .ms-chap{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:5px;
    background:var(--surface);padding:8px 9px;cursor:pointer}
  .ms-chap.active{border-color:var(--primary);background:var(--primary-weak)}
  .ms-chap-main{flex:1;min-width:0}
  .ms-chap-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms-chap-count{font-size:11px;color:var(--text-2);margin-top:1px}
  .ms-chap-ord{display:flex;flex-direction:column;gap:2px}
  .ms-chap-ord .mini{padding:0 5px;font-size:9px;line-height:1.5}
  .ms-editor{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .ms-title{font-size:16px;font-weight:700}
  .ms-body{min-height:58vh;line-height:1.9;font-size:15px}
  .ms-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:-2px}
  .ms-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ck{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:7px}
  .ck input{width:auto}
  /* ---- memo ---- */
  .memo-list{display:flex;flex-direction:column;gap:12px}
  .memo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px}
  .memo-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .memo-title{flex:1;font-weight:700;font-size:15px;border:none;background:transparent;padding:4px 2px}
  .memo-ord{display:flex;align-items:center;gap:3px;flex:0 0 auto}
  .memo-body{min-height:92px;line-height:1.7;font-size:14px}
  /* ---- search ---- */
  .srch-results{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
  .srch-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:5px;padding:8px 10px}
  .srch-item:hover{background:var(--surface-2)}
  .srch-type{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-weak);border-radius:3px;padding:2px 7px}
  .srch-label{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ---- tags ---- */
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tag{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-weak);border:1px solid transparent;
    border-radius:3px;padding:2px 8px;cursor:pointer}
  .tag:hover{border-color:var(--primary)}
  .tagfilter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);background:var(--surface-2);
    border:1px solid var(--border);border-radius:5px;padding:7px 11px;margin-bottom:12px}
  .char-top + .tags{padding:0 13px 12px}
  .memo-tags{font-size:12.5px;margin-top:8px;border:none;background:transparent;padding:4px 2px;color:var(--text-2)}
  /* ---- scenario (ゲームシナリオ) ---- */
  .sc-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .sc-head .ms-title{flex:1}
  .sc-cmds{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px}
  .sc-cmd{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:8px 10px}
  .sc-cmd-body{flex:1;min-width:0;font-size:13.5px;line-height:1.55;word-break:break-word}
  .sc-cmd-ord{display:flex;align-items:center;gap:3px;flex:0 0 auto}
  .sc-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px;color:#fff;vertical-align:middle}
  .sc-badge.line{background:var(--primary)} .sc-badge.narr{background:#8d8f94} .sc-badge.choice{background:#d98324}
  .sc-badge.set{background:#8a6d3b} .sc-badge.if{background:#2f6fb3}
  .sc-next{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
  .sc-next select{width:auto;min-width:150px}
  .sc-face{color:var(--text-2);font-size:12px;margin:0 2px}
  .sc-addbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .btn.mini2{padding:5px 9px;font-size:12px}
  .sc-seq{display:flex;flex-direction:column;gap:6px}
  .sc-choice-group{display:flex;flex-direction:column;gap:6px}
  .sc-nest{margin-left:12px;padding-left:12px;border-left:2px solid var(--primary-weak);display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .sc-opt-head{font-size:12.5px;font-weight:700;color:var(--primary);margin-top:4px}
  .flow-wrap{border:1px solid var(--border);border-radius:5px;background:var(--surface-2);padding:8px}
  #flowSvg{width:100%;height:auto;display:block}
  /* ---- 製本プレビュー ---- */
  #bookOverlay{position:fixed;inset:0;z-index:60;background:#4a4f55;display:flex;flex-direction:column}
  .book-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .book-pages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px}
  .book-page{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.45);color:#111;flex:0 0 auto}
  .bk-body{position:absolute;writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;overflow:hidden;
    font-family:"Hiragino Mincho ProN","YuMincho","Yu Mincho",serif;line-break:strict;text-align:justify;color:#111}
  .bk-body .bk-p{margin:0}
  .bk-body .bk-chap{margin:0 0 1em;font-size:1.3em;font-weight:600}
  .bk-body rt{font-size:.5em;font-weight:inherit;color:#111}
  .bk-kashira{position:absolute;top:6mm;left:0;right:0;text-align:center;font-size:7pt;color:#666;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  .bk-nombre{position:absolute;bottom:6mm;left:0;right:0;text-align:center;font-size:8pt;color:#333;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  @media print{
    header, nav.tabs, #main, #overlayHost{ display:none !important; }
    #bookOverlay{ position:static !important; background:#fff !important; display:block !important; }
    .book-bar{ display:none !important; }
    .book-pages{ display:block !important; overflow:visible !important; padding:0 !important; }
    .book-page{ box-shadow:none !important; margin:0 !important; break-after:page; }
    .book-page:last-child{ break-after:auto; }
  }
  .ms-vert{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;width:100%;height:60vh;overflow-x:auto;overflow-y:hidden;
    border:1px solid var(--border);border-radius:5px;padding:18px;background:var(--surface);
    font-size:17px;line-height:2;font-family:"Hiragino Mincho ProN","YuMincho","Yu Mincho",serif;text-align:justify}
  .ms-vert p{margin:0 0 .2em}
  .ms-vert rt{font-size:.5em;color:var(--text-2)}
  @media (max-width:680px){ .ms-wrap{flex-direction:column} .ms-side{flex:none;width:100%} .ms-body{min-height:46vh} }
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .seg button{border:none;background:var(--surface);color:var(--text-2);padding:8px 14px;font-size:13px;font-weight:600}
  .seg button.active{background:var(--primary);color:var(--on-primary)}
  .swatch{display:flex;gap:6px;flex-wrap:wrap}
  .swatch label{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .swatch input{display:none}
  .swatch input:checked + span{outline:2px solid var(--text);outline-offset:2px}
  .swatch span{display:block;width:26px;height:26px;border-radius:50%}
  @media (max-width:520px){ .proj-select{max-width:140px} main{padding:14px 12px 80px} }
  /* ---- auth chip ---- */
  #authChip{display:none;align-items:center;gap:6px;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:0 0 auto}
  .sync-dot.saving{background:#f5a524}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark"></span>Fabula</div>
  <select class="proj-select" id="projSelect" title="作品を選択"></select>
  <button class="btn" id="newProjBtn">＋ 作品</button>
  <div class="spacer"></div>
  <button class="btn" id="authChip"></button>
  <button class="btn icon subtle" id="searchBtn" title="検索"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg></button>
  <button class="btn icon" id="menuBtn" title="メニュー">☰</button>
</header>

<nav class="tabs" id="tabs" hidden>
  <button data-view="characters" class="active">キャラクター</button>
  <button data-view="plot">プロット</button>
  <button data-view="world">世界観</button>
  <button data-view="relations">相関図</button>
  <button data-view="timeline">タイムライン</button>
  <button data-view="manuscript">原稿</button>
  <button data-view="scenario">シナリオ</button>
  <button data-view="memo">メモ</button>
</nav>

<main id="main"></main>

<div id="overlayHost"></div>

<div id="bookOverlay" hidden>
  <div class="book-bar">
    <b>製本プレビュー</b>
    <span class="muted" id="bookInfo"></span>
    <div class="spacer" style="flex:1"></div>
    <button class="btn" id="bookSettingsBtn">設定</button>
    <button class="btn primary" id="bookPrintBtn">PDFに保存 / 印刷</button>
    <button class="btn" id="bookCloseBtn">閉じる</button>
  </div>
  <div class="book-pages" id="bookPrint"></div>
</div>

<script>
"use strict";
// ============================ 保存層（今はローカル。将来Firestoreに差し替え可能） ============================
const STORE_KEY = "fabula:v1";
const COLORS = ["#0e8c7f","#e5484d","#f5a524","#30a46c","#3b7dd8","#e93d82","#0091ff","#8d6e63","#12a594","#d6409f"];

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem("storyforge:v1"); // 旧名(StoryForge)のデータも自動で引き継ぐ
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { projects:[], currentId:null, data:{} };
}
function saveLocal(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ alert("保存に失敗しました（容量超過かも）: "+e.message); } }
function save(){ saveLocal(); queueSync(state.currentId); }   // ローカル保存＋（ログイン時）クラウド同期
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function emptyProjectData(){ return { characters:[], plot:{structure:"kishoutenketsu",cards:[]}, world:[], relations:[], timeline:[], manuscript:{chapters:[]}, scenario:{scenes:[],vars:[]}, memos:[] }; }
function cur(){ return state.data[state.currentId]; }
function curProject(){ return state.projects.find(p=>p.id===state.currentId); }

let currentView = "characters";

// ============================ 画像: アップロード時に縮小してdataURL化（localStorage肥大を防ぐ） ============================
function fileToSmallDataUrl(file, max=320){
  return new Promise((res,rej)=>{
    const img = new Image(); const fr = new FileReader();
    fr.onload = ()=>{ img.onload = ()=>{
      const sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82));
    }; img.onerror=rej; img.src = fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

// ============================ プロジェクト ============================
function renderProjectBar(){
  const sel = document.getElementById("projSelect");
  sel.innerHTML = state.projects.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join("")
    || `<option disabled selected>作品がありません</option>`;
  if(state.currentId) sel.value = state.currentId;
  const p = curProject();
  document.getElementById("tabs").hidden = !p;
}
function switchProject(id){ state.currentId=id; _tagFilter=null; save(); renderAll(); animateMain(); }

function openProjectModal(){
  openModal(`<h3>新しい作品</h3>
    <div class="field"><label>タイトル</label><input id="pTitle" placeholder="作品名" autofocus></div>
    <div class="modal-actions">
      <button class="btn" data-close>キャンセル</button>
      <button class="btn primary" id="pCreate">作成</button>
    </div>`, (root)=>{
      const create=()=>{
        const title=root.querySelector("#pTitle").value.trim(); if(!title){alert("タイトルを入力してください");return;}
        const id=uid(); state.projects.push({id,title,createdAt:Date.now()});
        state.data[id]=emptyProjectData(); state.currentId=id; save(); closeModal(); renderAll();
      };
      root.querySelector("#pCreate").onclick=create;
      root.querySelector("#pTitle").addEventListener("keydown",e=>{ if(e.key==="Enter") create(); });
    });
}

// ============================ 各ビュー描画 ============================
// ---- アニメーション（prefers-reduced-motion 尊重） ----
function prefersReduced(){ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function flashIn(el){ if(!el||prefersReduced())return; el.animate([{opacity:0,transform:'translateY(-5px)'},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.7,.3,1)'}); }
function animateMain(){ if(prefersReduced())return; const m=document.getElementById("main"); if(m) m.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:180,easing:'ease-out'}); }
let _flashId=null;
function applyFlash(){ if(!_flashId)return; const id=_flashId; _flashId=null; const el=document.querySelector('[data-id="'+id+'"]'); flashIn(el); }

// ---- タグ（キャラ/世界観/プロット/メモ） ----
let _tagFilter=null;
function parseTags(s){ return (s||"").split(/[,、\s]+/).map(t=>t.trim()).filter(Boolean); }
function tagChipsHtml(tags){ return (tags&&tags.length)? `<div class="tags">${tags.map(t=>`<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join("")}</div>` : ""; }
function tagMatch(item){ return !_tagFilter || (item.tags||[]).includes(_tagFilter); }
function tagFilterBarHtml(){ return _tagFilter? `<div class="tagfilter"><span>タグ「${esc(_tagFilter)}」で絞り込み中</span><button class="mini" id="clearTagF">✕ 解除</button></div>` : ""; }
function wireTags(scope){ (scope||document).querySelectorAll(".tag").forEach(el=>{ el.onclick=e=>{ e.stopPropagation(); _tagFilter=el.dataset.tag; renderView(); }; });
  const b=document.getElementById("clearTagF"); if(b) b.onclick=()=>{ _tagFilter=null; renderView(); }; }

function renderAll(){ renderProjectBar(); renderView(); }
function renderView(){
  const main=document.getElementById("main");
  if(!curProject()){
    main.innerHTML=`<div class="empty"><div class="big">まだ作品がありません</div>
      <button class="btn primary" onclick="openProjectModal()">＋ 最初の作品を作る</button></div>`;
    return;
  }
  ({characters:renderCharacters, plot:renderPlot, world:renderWorld, relations:renderRelations, timeline:renderTimeline, manuscript:renderManuscript, scenario:renderScenario, memo:renderMemos}[currentView])(main);
  applyFlash();
}

// ---- キャラクター ----
function renderCharacters(main){
  const list=cur().characters.filter(tagMatch);
  main.innerHTML=`<div class="view-head"><h2>キャラクター</h2><span class="muted">${list.length}人</span>
    <div class="spacer" style="flex:1"></div><button class="btn primary" id="addChar">＋ キャラ追加</button></div>
    ${tagFilterBarHtml()}
    ${list.length? `<div class="grid" id="charGrid"></div>` :
      `<div class="empty">${_tagFilter?'このタグのキャラはいません':'キャラクターを追加しましょう'}</div>`}`;
  document.getElementById("addChar").onclick=()=>editCharacter(null);
  const grid=document.getElementById("charGrid");
  if(grid){ grid.innerHTML=list.map(c=>{
    const fields=(c.fields||[]).filter(f=>f.k||f.v).map(f=>`${esc(f.k)}: ${esc(f.v)}`).join(" / ");
    const av=c.image?`<img class="avatar" src="${c.image}" alt="">`
      :`<div class="avatar" style="background:${c.color||'#888'}">${esc((c.name||"?").slice(0,1))}</div>`;
    return `<div class="card" data-id="${c.id}"><div class="char-top">${av}
      <div style="min-width:0"><div class="char-name">${esc(c.name||"(無名)")}</div>
      <div class="char-fields">${fields||"<span class='muted'>項目なし</span>"}</div></div></div>${tagChipsHtml(c.tags)}</div>`;
  }).join("");
    grid.querySelectorAll(".card").forEach(el=>el.onclick=()=>editCharacter(el.dataset.id));
  }
  wireTags(main);
}
function editCharacter(id){
  const c = id? cur().characters.find(x=>x.id===id) : {id:uid(),name:"",color:COLORS[cur().characters.length%COLORS.length],image:"",fields:[{k:"年齢",v:""},{k:"性格",v:""}],tags:[]};
  const fieldsHtml = (c.fields.length?c.fields:[{k:"",v:""}]).map((f,i)=>fieldRow(f,i)).join("");
  openModal(`<h3>${id?"キャラ編集":"キャラ追加"}</h3>
    <div class="field"><label>名前</label><input id="cName" value="${esc(c.name)}" placeholder="キャラクター名"></div>
    <div class="field"><label>タグ（カンマ区切り）</label><input id="cTags" value="${esc((c.tags||[]).join(', '))}" placeholder="例: 主人公, 脇役"></div>
    <div class="field"><label>色</label><div class="swatch" id="cColor">${COLORS.map(col=>
      `<label><input type="radio" name="col" value="${col}" ${col===c.color?"checked":""}><span style="background:${col}"></span></label>`).join("")}</div></div>
    <div class="field"><label>画像</label><input type="file" accept="image/*" id="cImg">
      <div id="imgPrev" style="margin-top:8px">${c.image?`<img src="${c.image}" style="width:72px;height:72px;border-radius:5px;object-fit:cover">`:""}</div></div>
    <div class="field"><label>項目（自由に追加できます）</label><div id="cFields">${fieldsHtml}</div>
      <button class="mini" id="addField" style="margin-top:4px">＋ 項目追加</button></div>
    <div class="modal-actions">
      ${id?`<button class="btn danger" id="delChar">削除</button>`:""}
      <div class="spacer" style="flex:1"></div>
      <button class="btn" data-close>キャンセル</button>
      <button class="btn primary" id="saveChar">保存</button>
    </div>`, (root)=>{
      let image=c.image;
      root.querySelector("#cImg").onchange=async e=>{
        const f=e.target.files[0]; if(!f)return;
        image=await fileToSmallDataUrl(f);
        root.querySelector("#imgPrev").innerHTML=`<img src="${image}" style="width:72px;height:72px;border-radius:5px;object-fit:cover">`;
      };
      root.querySelector("#addField").onclick=()=>{
        const d=document.createElement("div"); d.innerHTML=fieldRow({k:"",v:""});
        root.querySelector("#cFields").appendChild(d.firstElementChild); bindFieldRemovers(root);
      };
      bindFieldRemovers(root);
      root.querySelector("#saveChar").onclick=()=>{
        const name=root.querySelector("#cName").value.trim();
        const color=(root.querySelector('input[name="col"]:checked')||{}).value||c.color;
        const fields=[...root.querySelectorAll("#cFields .field-row")].map(r=>({
          k:r.querySelector(".fk").value.trim(), v:r.querySelector(".fv").value.trim()
        })).filter(f=>f.k||f.v);
        const tags=parseTags(root.querySelector("#cTags").value);
        const obj={id:c.id,name,color,image,fields,tags};
        if(id){ const i=cur().characters.findIndex(x=>x.id===id); cur().characters[i]=obj; }
        else { cur().characters.push(obj); _flashId=obj.id; }
        save(); closeModal(); renderView();
      };
      if(id) root.querySelector("#delChar").onclick=()=>{
        if(!confirm("このキャラを削除しますか？関連する相関図の線も消えます")) return;
        cur().characters=cur().characters.filter(x=>x.id!==id);
        cur().relations=cur().relations.filter(r=>r.from!==id&&r.to!==id);
        save(); closeModal(); renderView();
      };
    });
}
function fieldRow(f){ return `<div class="field-row"><input class="fk" placeholder="項目名" value="${esc(f.k)}"><input class="fv" placeholder="内容" value="${esc(f.v)}"><button class="mini rm" title="削除">×</button></div>`; }
function bindFieldRemovers(root){ root.querySelectorAll("#cFields .rm").forEach(b=>b.onclick=()=>{ b.closest(".field-row").remove(); }); }

// ---- プロット ----
const KISHO=[{k:"ki",label:"起",color:"#30a46c"},{k:"sho",label:"承",color:"#0091ff"},{k:"ten",label:"転",color:"#f5a524"},{k:"ketsu",label:"結",color:"#e5484d"}];
function renderPlot(main){
  const p=cur().plot;
  main.innerHTML=`<div class="view-head"><h2>プロット</h2>
    <div class="seg" id="plotStruct">
      <button data-s="kishoutenketsu" class="${p.structure==='kishoutenketsu'?'active':''}">起承転結</button>
      <button data-s="free" class="${p.structure==='free'?'active':''}">自由構成</button>
    </div></div>${tagFilterBarHtml()}<div class="lanes" id="lanes"></div>`;
  main.querySelector("#plotStruct").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return; p.structure=b.dataset.s; save(); renderView();
  });
  const lanes = p.structure==="kishoutenketsu"
    ? KISHO.map(s=>({key:s.k,label:s.label,color:s.color}))
    : [{key:"scene",label:"シーン / 場面",color:"#0e8c7f"}];
  const host=document.getElementById("lanes");
  host.innerHTML=lanes.map(l=>{
    const cards=p.cards.filter(c=>c.section===l.key && tagMatch(c));
    return `<div class="lane"><h3><span class="dot" style="background:${l.color}"></span>${l.label}</h3>
      <div data-lane="${l.key}">${cards.map((c,i)=>plotCardHtml(c,i,cards.length)).join("")}</div>
      <button class="add-card" data-add="${l.key}">＋ カード</button></div>`;
  }).join("");
  host.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>editPlotCard(null,b.dataset.add));
  host.querySelectorAll(".plot-card").forEach(el=>{
    el.querySelector(".edit").onclick=()=>editPlotCard(el.dataset.id);
    el.querySelector(".up").onclick=()=>movePlotCard(el.dataset.id,-1);
    el.querySelector(".down").onclick=()=>movePlotCard(el.dataset.id,1);
  });
  wireTags(main);
}
function plotCardHtml(c,i,n){ return `<div class="plot-card" data-id="${c.id}">
  <div class="t">${esc(c.title||"(無題)")}</div>${c.body?`<div class="b">${esc(c.body)}</div>`:""}
  ${tagChipsHtml(c.tags)}
  <div class="row"><button class="mini up" ${i===0?"disabled":""}>▲</button>
  <button class="mini down" ${i===n-1?"disabled":""}>▼</button>
  <button class="mini edit">編集</button></div></div>`; }
function movePlotCard(id,dir){
  const p=cur().plot; const card=p.cards.find(c=>c.id===id);
  const sec=p.cards.filter(c=>c.section===card.section);
  const idx=sec.indexOf(card); const swap=sec[idx+dir]; if(!swap)return;
  const a=p.cards.indexOf(card), b=p.cards.indexOf(swap);
  [p.cards[a],p.cards[b]]=[p.cards[b],p.cards[a]]; save(); renderView();
}
function editPlotCard(id,section){
  const c = id? cur().plot.cards.find(x=>x.id===id) : {id:uid(),section,title:"",body:"",tags:[]};
  openModal(`<h3>${id?"カード編集":"カード追加"}</h3>
    <div class="field"><label>タイトル</label><input id="pcT" value="${esc(c.title)}" placeholder="見出し"></div>
    <div class="field"><label>内容</label><textarea id="pcB" placeholder="展開・メモ">${esc(c.body)}</textarea></div>
    <div class="field"><label>タグ（カンマ区切り）</label><input id="pcTags" value="${esc((c.tags||[]).join(', '))}" placeholder="例: 伏線, 回収"></div>
    <div class="modal-actions">${id?`<button class="btn danger" id="pcDel">削除</button>`:""}
      <div class="spacer" style="flex:1"></div>
      <button class="btn" data-close>キャンセル</button><button class="btn primary" id="pcSave">保存</button></div>`,
    (root)=>{
      root.querySelector("#pcSave").onclick=()=>{
        c.title=root.querySelector("#pcT").value.trim(); c.body=root.querySelector("#pcB").value.trim(); c.tags=parseTags(root.querySelector("#pcTags").value);
        if(!id){ cur().plot.cards.push(c); _flashId=c.id; } save(); closeModal(); renderView();
      };
      if(id) root.querySelector("#pcDel").onclick=()=>{ cur().plot.cards=cur().plot.cards.filter(x=>x.id!==id); save(); closeModal(); renderView(); };
    });
}

// ---- 世界観 ----
function renderWorld(main){
  const list=cur().world.filter(tagMatch);
  main.innerHTML=`<div class="view-head"><h2>世界観設定</h2><span class="muted">${list.length}件</span>
    <div class="spacer" style="flex:1"></div><button class="btn primary" id="addWorld">＋ 項目追加</button></div>
    ${tagFilterBarHtml()}<div id="worldHost"></div>`;
  document.getElementById("addWorld").onclick=()=>editWorld(null);
  const host=document.getElementById("worldHost");
  if(!list.length){ host.innerHTML=`<div class="empty">${_tagFilter?'このタグの項目はありません':'地名・組織・用語・歴史などを整理しましょう'}</div>`; wireTags(main); return; }
  const cats=[...new Set(list.map(w=>w.category||"その他"))];
  host.innerHTML=cats.map(cat=>`<div class="world-cat"><h3>${esc(cat)}</h3>
    ${list.filter(w=>(w.category||"その他")===cat).map(w=>`<div class="world-item" data-id="${w.id}">
      <div class="t">${esc(w.title||"(無題)")}</div>${w.body?`<div class="b">${esc(w.body)}</div>`:""}
      ${tagChipsHtml(w.tags)}
      <div class="row"><button class="mini edit">編集</button></div></div>`).join("")}</div>`).join("");
  host.querySelectorAll(".world-item .edit").forEach(b=>b.onclick=()=>editWorld(b.closest(".world-item").dataset.id));
  wireTags(main);
}
function editWorld(id){
  const w = id? cur().world.find(x=>x.id===id) : {id:uid(),category:"",title:"",body:"",tags:[]};
  const cats=[...new Set(cur().world.map(x=>x.category).filter(Boolean))];
  openModal(`<h3>${id?"項目編集":"項目追加"}</h3>
    <div class="field"><label>カテゴリ</label><input id="wCat" list="catList" value="${esc(w.category)}" placeholder="地名 / 組織 / 用語 / 歴史 など">
      <datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
    <div class="field"><label>タイトル</label><input id="wT" value="${esc(w.title)}" placeholder="名称"></div>
    <div class="field"><label>説明</label><textarea id="wB" placeholder="設定の説明">${esc(w.body)}</textarea></div>
    <div class="field"><label>タグ（カンマ区切り）</label><input id="wTags" value="${esc((w.tags||[]).join(', '))}" placeholder="例: 地名, 重要"></div>
    <div class="modal-actions">${id?`<button class="btn danger" id="wDel">削除</button>`:""}
      <div class="spacer" style="flex:1"></div>
      <button class="btn" data-close>キャンセル</button><button class="btn primary" id="wSave">保存</button></div>`,
    (root)=>{
      root.querySelector("#wSave").onclick=()=>{
        w.category=root.querySelector("#wCat").value.trim(); w.title=root.querySelector("#wT").value.trim(); w.body=root.querySelector("#wB").value.trim(); w.tags=parseTags(root.querySelector("#wTags").value);
        if(!id){ cur().world.push(w); _flashId=w.id; } save(); closeModal(); renderView();
      };
      if(id) root.querySelector("#wDel").onclick=()=>{ cur().world=cur().world.filter(x=>x.id!==id); save(); closeModal(); renderView(); };
    });
}

// ---- 相関図 ----
function renderRelations(main){
  const chars=cur().characters, rels=cur().relations;
  main.innerHTML=`<div class="view-head"><h2>相関図</h2><span class="muted">${chars.length}人 / ${rels.length}本</span>
    <div class="spacer" style="flex:1"></div>
    <button class="btn primary" id="addRel" ${chars.length<2?"disabled":""}>＋ 関係を追加</button></div>
    ${chars.length<2? `<div class="empty">キャラクターが2人以上いると相関図を作れます</div>` :
    `<div class="rel-wrap"><svg id="relSvg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid meet"></svg></div>
     <div class="rel-list" id="relList"></div>`}`;
  const addBtn=document.getElementById("addRel"); if(addBtn) addBtn.onclick=()=>editRelation(null);
  if(chars.length<2) return;
  startRelSim(chars,rels);
  document.getElementById("relList").innerHTML=rels.map(r=>{
    const a=chars.find(c=>c.id===r.from), b=chars.find(c=>c.id===r.to);
    if(!a||!b) return "";
    return `<div class="rel-row" data-id="${r.id}"><b>${esc(a.name)}</b>
      <span class="lbl">— ${esc(r.label||"関係")} →</span><b>${esc(b.name)}</b>
      <button class="mini edit">編集</button></div>`;
  }).join("") || `<div class="muted" style="text-align:center">まだ関係がありません</div>`;
  document.querySelectorAll("#relList .edit").forEach(btn=>btn.onclick=()=>editRelation(btn.closest(".rel-row").dataset.id));
}
// 相関図：力学レイアウト（反発＋バネ＋減衰）＋ドラッグで「ふにふに」動く
let _relSim=null;
function startRelSim(chars,rels){
  const svg=document.getElementById("relSvg"); if(!svg) return;
  const W=800,H=420,cx=W/2,cy=H/2,R=Math.min(W,H)/2-70;
  const nodes=chars.map((c,i)=>{ const a=-Math.PI/2+i*2*Math.PI/chars.length;
    return { id:c.id, c, x:cx+R*Math.cos(a), y:cy+R*Math.sin(a), vx:0, vy:0 }; });
  const nodeById={}; nodes.forEach(n=>nodeById[n.id]=n);
  const edges=rels.map(r=>({from:nodeById[r.from], to:nodeById[r.to], label:r.label})).filter(e=>e.from&&e.to);
  const sim={ svg, W,H,cx,cy, nodes, nodeById, edges, drag:null, dragX:0, dragY:0, reduced:prefersReduced() };
  _relSim=sim;
  setupRelDrag(sim);
  if(sim.reduced){ for(let k=0;k<200;k++) stepRel(sim); drawRel(sim); }
  else { const loop=()=>{ if(!document.body.contains(sim.svg)) return; stepRel(sim); drawRel(sim); requestAnimationFrame(loop); }; loop(); }
}
function stepRel(sim){
  const nodes=sim.nodes, edges=sim.edges;
  const REST=150, K_SPRING=0.015, K_REP=5400, K_CENTER=0.008, DAMP=0.86;
  for(let i=0;i<nodes.length;i++){ const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy; if(d2<1){d2=1;dx=Math.random();dy=Math.random();}
      const d=Math.sqrt(d2), f=K_REP/d2, fx=dx/d*f, fy=dy/d*f;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
  }
  edges.forEach(e=>{ let dx=e.to.x-e.from.x, dy=e.to.y-e.from.y; const d=Math.hypot(dx,dy)||1;
    const f=(d-REST)*K_SPRING, fx=dx/d*f, fy=dy/d*f;
    e.from.vx+=fx; e.from.vy+=fy; e.to.vx-=fx; e.to.vy-=fy;
  });
  nodes.forEach(n=>{
    if(sim.drag===n){ n.x=sim.dragX; n.y=sim.dragY; n.vx=0; n.vy=0; return; }
    n.vx+=(sim.cx-n.x)*K_CENTER; n.vy+=(sim.cy-n.y)*K_CENTER;
    n.vx*=DAMP; n.vy*=DAMP; n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(26,Math.min(sim.W-26,n.x)); n.y=Math.max(26,Math.min(sim.H-40,n.y));
  });
}
function drawRel(sim){
  const R=24;
  // 同じ2点間の複数関係（双方向など）はまとめて、重ならないよう左右に振り分ける
  const groups={};
  sim.edges.forEach(e=>{ const k=[e.from.id,e.to.id].sort().join('~'); (groups[k]=groups[k]||[]).push(e); });
  const meta=new Map();
  Object.entries(groups).forEach(([k,list])=>{
    const [idA,idB]=k.split('~'); const A=sim.nodeById[idA], B=sim.nodeById[idB];
    const dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||1; const perp={x:-dy/d, y:dx/d};  // ペアで固定の垂直方向
    list.forEach((e,i)=> meta.set(e,{i,n:list.length,perp}));
  });
  const defs=`<defs><marker id="rel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>`;
  let edgesSvg="";
  sim.edges.forEach(e=>{
    const p=e.from, q=e.to; const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    const sx=p.x+ux*R, sy=p.y+uy*R, ex=q.x-ux*R, ey=q.y-uy*R;              // ノード縁で止めて矢印を見せる
    const {i,n,perp}=meta.get(e); const off=(i-(n-1)/2)*26;
    let mx,my;
    if(!off){
      edgesSvg+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="var(--text-2)" stroke-width="1.5" opacity=".55" marker-end="url(#rel-arrow)"/>`;
      mx=(sx+ex)/2; my=(sy+ey)/2;
    } else {
      const cx=(p.x+q.x)/2+perp.x*off*2, cy=(p.y+q.y)/2+perp.y*off*2;
      edgesSvg+=`<path d="M${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="var(--text-2)" stroke-width="1.5" opacity=".55" marker-end="url(#rel-arrow)"/>`;
      mx=(p.x+q.x)/2+perp.x*off; my=(p.y+q.y)/2+perp.y*off;
    }
    if(e.label){ const w=e.label.length*8+10;
      edgesSvg+=`<rect x="${mx-w/2}" y="${my-9}" width="${w}" height="18" rx="4" fill="var(--surface)" stroke="var(--border)"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="11" fill="var(--text)">${esc(e.label)}</text>`;
    }
  });
  let nodesSvg="";
  sim.nodes.forEach(n=>{ const c=n.c;
    nodesSvg+=`<g class="rel-node" data-id="${n.id}"><circle cx="${n.x}" cy="${n.y}" r="22" fill="${c.color||'#888'}"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style="pointer-events:none">${esc((c.name||"?").slice(0,2))}</text><text x="${n.x}" y="${n.y+38}" text-anchor="middle" font-size="12" fill="var(--text)" style="pointer-events:none">${esc(c.name)}</text></g>`;
  });
  sim.svg.innerHTML=defs+edgesSvg+nodesSvg;
}
function setupRelDrag(sim){
  const svg=sim.svg;
  const toSvg=(ev)=>{ const r=svg.getBoundingClientRect(); return { x:(ev.clientX-r.left)/r.width*sim.W, y:(ev.clientY-r.top)/r.height*sim.H }; };
  svg.onpointerdown=(ev)=>{ const g=ev.target.closest('.rel-node'); if(!g)return; const n=sim.nodeById[g.dataset.id]; if(!n)return;
    sim.drag=n; const p=toSvg(ev); sim.dragX=p.x; sim.dragY=p.y; try{svg.setPointerCapture(ev.pointerId);}catch(e){} ev.preventDefault(); };
  svg.onpointermove=(ev)=>{ if(!sim.drag)return; const p=toSvg(ev); sim.dragX=p.x; sim.dragY=p.y;
    if(sim.reduced){ sim.drag.x=p.x; sim.drag.y=p.y; for(let k=0;k<6;k++) stepRel(sim); drawRel(sim); } };
  svg.onpointerup=svg.onpointercancel=()=>{ if(sim.reduced && sim.drag){ for(let k=0;k<60;k++) stepRel(sim); drawRel(sim); } sim.drag=null; };
}
function editRelation(id){

function renderTimeline(main){

let _msCurrentChapter = null;
function manuscript(){ const d=cur(); if(!d.manuscript) d.manuscript={chapters:[]}; return d.manuscript; }
function msCountChars(body){   // 本文の文字数（ルビ記法のよみ・記号は除外、親文字はカウント）
  let s = (body||"")
    .replace(/｜([^《]+)《[^》]+》/g, '$1')
    .replace(/([一-龠々〆ヵヶ]+)《[^》]+》/g, '$1');
  return s.replace(/[\s　]/g,"").length;
}

  const ms = manuscript();

// 青空文庫形式のルビを <ruby> に変換（｜親文字《ルビ》 と 漢字《ルビ》）
function renderRuby(text){
  let s = esc(text);
  s = s.replace(/｜([^《]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  s = s.replace(/([一-龠々〆ヵヶ]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>');
  return s;
}

const BOOK_SIZES = {

  b6:{w:128,h:182,label:"B6"}, shinsho:{w:103,h:182,label:"新書"}, b5:{w:182,h:257,label:"B5"}
};
const BOOK_DEFAULTS = { size:"a5", fontPt:8.5, lineH:1.8, mTop:15, mBottom:17, mOuter:15, mInner:18, nombre:true, kashira:true, chapterNewPage:true };

  document.getElementById("bookInfo").textContent="組版中…";
  setTimeout(renderBook, 30);

function closeBook(){ document.getElementById("bookOverlay").hidden=true; document.getElementById("bookPrint").innerHTML=""; }

function tokenizeRuby(line){
  const tokens=[]; const re=/｜([^《]+)《([^》]+)》|([一-龠々〆ヵヶ]+)《([^》]+)》/g; let m, last=0;
  while((m=re.exec(line))){
    for(const ch of line.slice(last,m.index)) tokens.push({base:ch,yomi:null});
    if(m[1]!=null) tokens.push({base:m[1],yomi:m[2]}); else tokens.push({base:m[3],yomi:m[4]});
    last=re.lastIndex;
  }
  for(const ch of line.slice(last)) tokens.push({base:ch,yomi:null});
  return tokens;
}
function tokensToHtml(tokens){
  return tokens.map(t=> t.yomi? `<ruby>${esc(t.base)}<rt>${esc(t.yomi)}</rt></ruby>` : esc(t.base)).join("");
}
function buildBlocks(){
  const blocks=[];
  for(const ch of manuscript().chapters){
    blocks.push({type:'chapter', text:ch.title||'無題'});
    for(const ln of (ch.body||"").split(/\n/)) blocks.push({type:'para', tokens: ln===""? [] : tokenizeRuby(ln)});
  }
  return blocks;
}
function makePageEl(opts, sz, pageNum, workTitle){
  const page=document.createElement('div'); page.className='book-page';
  page.style.width=sz.w+"mm"; page.style.height=sz.h+"mm";
  const odd = pageNum%2===1;                       // 右綴じ: 奇数=右ページ(のど=右)
  const left = (odd? opts.mOuter : opts.mInner)+"mm";
  const right= (odd? opts.mInner : opts.mOuter)+"mm";
  const body=document.createElement('div'); body.className='bk-body';
  body.style.top=opts.mTop+"mm"; body.style.bottom=opts.mBottom+"mm"; body.style.left=left; body.style.right=right;
  body.style.fontSize=opts.fontPt+"pt"; body.style.lineHeight=opts.lineH;
  page.appendChild(body);
  if(opts.kashira && workTitle){ const k=document.createElement('div'); k.className='bk-kashira'; k.textContent=workTitle; page.appendChild(k); }
  if(opts.nombre){ const n=document.createElement('div'); n.className='bk-nombre'; n.textContent=pageNum; page.appendChild(n); }
  return {page, body};
}
function applyPageCSS(sz){
  let st=document.getElementById("bookPageCSS");
  if(!st){ st=document.createElement('style'); st.id="bookPageCSS"; document.head.appendChild(st); }
  st.textContent=`@media print{ @page{ size:${sz.w}mm ${sz.h}mm; margin:0 } }`;
}
function renderBook(){
  const opts=loadBookSettings(); const sz=BOOK_SIZES[opts.size]||BOOK_SIZES.a5;
  applyPageCSS(sz);
  const host=document.getElementById("bookPrint"); host.innerHTML="";
  const title=curProject().title||"";
  const blocks=buildBlocks();
  let page, body;
  const newPage=()=>{ const r=makePageEl(opts,sz,host.children.length+1,title); host.appendChild(r.page); page=r.page; body=r.body; };
  const overflow=()=>body.scrollWidth > body.clientWidth + 1;      // 縦書きは左へあふれる
  newPage();
  for(const blk of blocks){
    if(blk.type==='chapter'){
      if(opts.chapterNewPage && body.childNodes.length) newPage();
      const h=document.createElement('div'); h.className='bk-chap'; h.textContent=blk.text; body.appendChild(h);
      if(overflow()){ body.removeChild(h); newPage(); body.appendChild(h); }
      continue;
    }
    if(blk.tokens.length===0){ const p=document.createElement('p'); p.className='bk-p'; p.innerHTML='<br>'; body.appendChild(p); if(overflow()){ body.removeChild(p); newPage(); } continue; }
    const pFull=document.createElement('p'); pFull.className='bk-p'; pFull.innerHTML=tokensToHtml(blk.tokens); body.appendChild(pFull);
    if(!overflow()) continue;
    body.removeChild(pFull);
    let rest=blk.tokens.slice();
    while(rest.length){
      const p=document.createElement('p'); p.className='bk-p'; body.appendChild(p);
      p.innerHTML=tokensToHtml(rest);
      if(!overflow()){ rest=[]; break; }
      let lo=1, hi=rest.length, fit=0;
      while(lo<=hi){ const mid=(lo+hi)>>1; p.innerHTML=tokensToHtml(rest.slice(0,mid)); if(overflow()) hi=mid-1; else { fit=mid; lo=mid+1; } }
      if(fit===0){ // ページが空でも1字入らない=異常。無限ループ防止に最低1字
        if(body.querySelectorAll('.bk-p,.bk-chap').length<=1){ p.innerHTML=tokensToHtml(rest.slice(0,1)); rest=rest.slice(1); if(rest.length) newPage(); continue; }
        body.removeChild(p); newPage(); continue;
      }
      p.innerHTML=tokensToHtml(rest.slice(0,fit)); rest=rest.slice(fit);
      if(rest.length) newPage();
    }
  }
  document.getElementById("bookInfo").textContent = `${sz.label}・${host.children.length}ページ`;
}

// ---- ゲームシナリオ（ノベルゲーム/ADV：シーン＝コマンド列・選択肢分岐・フロー図） ----
function scenario(){ const d=cur(); if(!d.scenario) d.scenario={scenes:[],vars:[]}; if(!d.scenario.vars) d.scenario.vars=[]; return d.scenario; }
let _scCurScene = null;
function scVars(){ return scenario().vars; }
function varById(id){ return scVars().find(v=>v.id===id); }
const SET_OP_FLAG={on:'をONにする',off:'をOFFにする',toggle:'を切り替え'};
const SET_OP_NUM={set:'=',add:'+=',sub:'-='};
const CMP_FLAG={on:'がON',off:'がOFF'};
const CMP_NUM={ge:'≥',le:'≤',eq:'=',gt:'>',lt:'<'};
function cmdTypeLabel(t){ return {line:"セリフ",narration:"地の文",choice:"選択肢",set:"変数",if:"条件分岐"}[t]||t; }
function defaultCmd(type){
  if(type==='line') return {charId:"",speaker:"",face:"",text:""};
  if(type==='choice') return {options:[]};
  if(type==='set') return {varId:"",op:"",value:0};
  if(type==='if') return {varId:"",cmp:"",value:0,then:[],else:[]};
  return {text:""};
}
function sceneName(id){ const s=scenario().scenes.find(x=>x.id===id); return s? (s.title||"無題") : "（未設定）"; }
function cmdSpeaker(cmd){ const c=cur().characters.find(x=>x.id===cmd.charId); return c? c.name : (cmd.speaker||"？"); }
function setSummary(cmd){ const v=varById(cmd.varId); if(!v) return "(変数未設定)";
  return v.type==='flag' ? `${esc(v.name)}${SET_OP_FLAG[cmd.op]||''}` : `${esc(v.name)} ${SET_OP_NUM[cmd.op]||'='} ${esc(String(cmd.value??0))}`; }
function ifSummary(cmd){ const v=varById(cmd.varId); if(!v) return "(変数未設定)";
  return v.type==='flag' ? `${esc(v.name)}${CMP_FLAG[cmd.cmp]||''}` : `${esc(v.name)}${CMP_NUM[cmd.cmp]||''}${esc(String(cmd.value??0))}`; }
function cmdSummary(cmd){
  switch(cmd.type){
    case 'line': return `<span class="sc-badge line">セリフ</span><b>${esc(cmdSpeaker(cmd))}</b>${cmd.face?`<span class="sc-face">(${esc(cmd.face)})</span>`:""}「${esc(cmd.text||"")}」`;
    case 'narration': return `<span class="sc-badge narr">地の文</span>${esc(cmd.text||"")}`;
    case 'choice': return `<span class="sc-badge choice">選択肢</span>`+((cmd.options||[]).map(o=>`「${esc(o.text||"")}」${o.to?` → ${esc(sceneName(o.to))}`:""}`).join("　/　")||"（未設定）");
    case 'set': return `<span class="sc-badge set">変数</span>${setSummary(cmd)}`;
    case 'if': return `<span class="sc-badge if">条件</span>もし ${ifSummary(cmd)} なら`;
    default: return "";
  }
}

function mkMini(label,disabled){ const b=document.createElement('button'); b.className='mini'; b.textContent=label; if(disabled)b.disabled=true; return b; }
function buildAddBar(list){
  const bar=document.createElement('div'); bar.className='sc-addbar';
  const lbl=document.createElement('span'); lbl.className='muted'; lbl.style.fontSize='12px'; lbl.textContent='追加:'; bar.appendChild(lbl);
  [['line','セリフ'],['narration','地の文'],['choice','選択肢'],['set','変数'],['if','条件']].forEach(([t,label])=>{
    const b=document.createElement('button'); b.className='btn mini2'; b.textContent=label; b.onclick=()=>editCommand(null,t,list); bar.appendChild(b);
  });
  return bar;
}
function buildSeq(cmds){
  const wrap=document.createElement('div'); wrap.className='sc-seq';
  cmds.forEach((c,i)=> wrap.appendChild(buildCmdRow(c,cmds,i)));
  wrap.appendChild(buildAddBar(cmds));
  return wrap;
}
function buildCmdRow(cmd, list, i){
  const row=document.createElement('div'); row.className='sc-cmd'; row.dataset.id=cmd.id;
  const body=document.createElement('div'); body.className='sc-cmd-body'; body.innerHTML=cmdSummary(cmd);
  const ord=document.createElement('div'); ord.className='sc-cmd-ord';
  const up=mkMini('▲', i===0); up.onclick=()=>{ [list[i-1],list[i]]=[list[i],list[i-1]]; save(); renderCmdList(); };
  const dn=mkMini('▼', i===list.length-1); dn.onclick=()=>{ [list[i+1],list[i]]=[list[i],list[i+1]]; save(); renderCmdList(); };
  const ed=mkMini('編集',false); ed.onclick=()=>editCommand(cmd.id,null,list);
  ord.append(up,dn,ed); row.append(body,ord);
  if(cmd.type==='choice'){
    const group=document.createElement('div'); group.className='sc-choice-group'; group.appendChild(row);
    const nest=document.createElement('div'); nest.className='sc-nest';
    (cmd.options||[]).forEach(opt=>{
      const oh=document.createElement('div'); oh.className='sc-opt-head';
      oh.textContent=`「${opt.text||'(選択肢)'}」`+(opt.to?` → ${sceneName(opt.to)}`:"：この下に続き");
      nest.appendChild(oh);
      if(!opt.to){ if(!opt.commands)opt.commands=[]; nest.appendChild(buildSeq(opt.commands)); }
    });
    group.appendChild(nest); return group;
  }
  if(cmd.type==='if'){
    const group=document.createElement('div'); group.className='sc-choice-group'; group.appendChild(row);
    const nest=document.createElement('div'); nest.className='sc-nest';
    const h1=document.createElement('div'); h1.className='sc-opt-head'; h1.textContent='満たすとき'; nest.appendChild(h1);
    if(!cmd.then)cmd.then=[]; nest.appendChild(buildSeq(cmd.then));
    const h2=document.createElement('div'); h2.className='sc-opt-head'; h2.textContent='満たさないとき（任意）'; nest.appendChild(h2);
    if(!cmd.else)cmd.else=[]; nest.appendChild(buildSeq(cmd.else));
    group.appendChild(nest); return group;
  }
  return row;
}
function addScene(){ const s={id:uid(),title:`シーン${scenario().scenes.length+1}`,commands:[]}; scenario().scenes.push(s); _scCurScene=s.id; _flashId=s.id; save(); renderView(); setTimeout(()=>document.getElementById("scTitle")?.focus(),0); }
function moveScene(id,dir){ const a=scenario().scenes;const i=a.findIndex(s=>s.id===id);const j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderSceneList(); }
function deleteScene(id){ const s=scenario().scenes.find(x=>x.id===id);if(!s)return; if(!confirm(`シーン「${s.title||'無題'}」を削除します。よろしいですか？`))return; scenario().scenes=scenario().scenes.filter(x=>x.id!==id); if(_scCurScene===id)_scCurScene=scenario().scenes[0]?.id||null; save(); renderView(); }

    <p class="muted" style="font-size:12px;margin:8px 2px 0">実線＝選択肢の飛び先 / 点線＝「次のシーン」。</p>`);

function drawFlow(){
  const svg=document.getElementById("flowSvg"); if(!svg)return;
  const scenes=scenario().scenes; const W=800,H=520;
  const n=scenes.length||1; const cols=Math.ceil(Math.sqrt(n)); const rows=Math.ceil(n/cols);
  const cw=W/cols, ch=H/rows; const pos={};
  scenes.forEach((s,i)=>{ const r=Math.floor(i/cols), c=i%cols; pos[s.id]={x:c*cw+cw/2, y:r*ch+ch/2}; });
  let defs=`<defs><marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>`;
  // ネストしたコマンド(選択肢の続き・条件分岐)も辿ってジャンプを収集
  const jumps=[];
  const scan=(cmds,fromId)=>{ (cmds||[]).forEach(c=>{
    if(c.type==='choice'){ (c.options||[]).forEach(o=>{ if(o.to) jumps.push({from:fromId,to:o.to,kind:'choice'}); else scan(o.commands,fromId); }); }
    else if(c.type==='if'){ scan(c.then,fromId); scan(c.else,fromId); }
  }); };
  scenes.forEach(s=>{ scan(s.commands,s.id); if(s.next) jumps.push({from:s.id,to:s.next,kind:'next'}); });
  let edges="", nodes="";
  jumps.forEach(j=>{ if(j.to===j.from||!pos[j.to]||!pos[j.from])return; const p=pos[j.from],q=pos[j.to];
    const dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    const x1=p.x+ux*56,y1=p.y+uy*22,x2=q.x-ux*58,y2=q.y-uy*24;
    const dash=j.kind==='next'?' stroke-dasharray="5 4"':'';
    edges+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--text-2)" stroke-width="1.5" opacity=".6"${dash} marker-end="url(#fl-arrow)"/>`;
  });
  scenes.forEach(s=>{ const p=pos[s.id]; const label=(s.title||'無題');
    nodes+=`<g><rect x="${p.x-54}" y="${p.y-18}" width="108" height="36" rx="5" fill="var(--primary-weak)" stroke="var(--primary)"/>
      <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="12" fill="var(--text)">${esc(label.length>8?label.slice(0,8)+'…':label)}</text></g>`;
  });
  svg.innerHTML=defs+edges+nodes;
}

function searchProject(q){
  q=(q||"").trim().toLowerCase(); const d=cur(); if(!q||!d) return [];
  const hit=s=>(s||"").toLowerCase().includes(q); const res=[];
  (d.characters||[]).forEach(c=>{ if(hit(c.name)||(c.fields||[]).some(f=>hit(f.k)||hit(f.v))||(c.tags||[]).some(hit)) res.push({type:'character',id:c.id,label:c.name||'(無名)',sub:'キャラ'}); });
  (d.world||[]).forEach(w=>{ if(hit(w.title)||hit(w.body)||hit(w.category)||(w.tags||[]).some(hit)) res.push({type:'world',id:w.id,label:w.title||'(無題)',sub:'世界観'}); });
  ((d.plot&&d.plot.cards)||[]).forEach(c=>{ if(hit(c.title)||hit(c.body)||(c.tags||[]).some(hit)) res.push({type:'plot',id:c.id,label:c.title||'(無題)',sub:'プロット'}); });
  (d.timeline||[]).forEach(e=>{ if(hit(e.when)||hit(e.title)||hit(e.body)) res.push({type:'timeline',id:e.id,label:e.title||'(無題)',sub:'年表'}); });
  (d.relations||[]).forEach(r=>{ const a=(d.characters||[]).find(c=>c.id===r.from),b=(d.characters||[]).find(c=>c.id===r.to);
    if(hit(r.label)||(a&&hit(a.name))||(b&&hit(b.name))) res.push({type:'relation',id:r.id,label:`${a?a.name:'?'} → ${b?b.name:'?'}（${r.label||''}）`,sub:'相関図'}); });
  ((d.manuscript&&d.manuscript.chapters)||[]).forEach(ch=>{ if(hit(ch.title)||hit(ch.body)) res.push({type:'chapter',id:ch.id,label:ch.title||'(無題)',sub:'原稿'}); });
  ((d.scenario&&d.scenario.scenes)||[]).forEach(s=>{ let m=hit(s.title);
    if(!m){ const sc=cmds=>(cmds||[]).some(c=>hit(c.text)||hit(c.speaker)||(c.options||[]).some(o=>hit(o.text)||sc(o.commands))||sc(c.then)||sc(c.else)); m=sc(s.commands); }
    if(m) res.push({type:'scene',id:s.id,label:s.title||'(無題)',sub:'シナリオ'}); });
  (d.memos||[]).forEach(m=>{ if(hit(m.title)||hit(m.body)||(m.tags||[]).some(hit)) res.push({type:'memo',id:m.id,label:m.title||(m.body||'').slice(0,24)||'(空メモ)',sub:'メモ'}); });
  return res;
}

function serializeProject(id){
  const p = state.projects.find(x=>x.id===id); if(!p) return null;
  const data = state.data[id] || emptyProjectData();
  // 原稿の本文は章ごとに別ドキュメント(chapters)に保存 → 作品本体には目次(id/title)だけ入れて1MB上限を回避
  const ms = data.manuscript || {chapters:[]};
  const slim = { ...data, manuscript:{ chapters:(ms.chapters||[]).map(c=>({id:c.id,title:c.title})) } };
  return { title:p.title, createdAt:p.createdAt||Date.now(), data: slim };
}
function projectsCol(){ return fbDb.collection("users").doc(fbUser.uid).collection("projects"); }
function chaptersCol(pid){ return projectsCol().doc(pid).collection("chapters"); }

async function pullFromCloud(){
  if(!fbUser||!fbDb) return;
  const snap = await projectsCol().get();
  const remote = {};
  snap.forEach(d=> remote[d.id]=d.data());
  // 初回ログイン: この端末にしか無い作品はクラウドへ退避（本体＋各章）
  for(const p of [...state.projects]){
    if(!remote[p.id]){
      const doc = serializeProject(p.id); if(!doc) continue;
      await projectsCol().doc(p.id).set(doc);
      for(const ch of (state.data[p.id]?.manuscript?.chapters||[])){
        await chaptersCol(p.id).doc(ch.id).set({ title:ch.title||"", body:ch.body||"" });
      }
      remote[p.id] = doc;
    }
  }
  // クラウドの内容で state を作り直す
  const ids = Object.keys(remote);
  state.projects = ids.map(id=>({ id, title:remote[id].title||"(無題)", createdAt:remote[id].createdAt||0 }))
                      .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  state.data = {};
  ids.forEach(id=> state.data[id] = remote[id].data || emptyProjectData());
  // 各作品の章本文を chapters サブコレクションから読み込む
  for(const id of ids){
    const data = state.data[id];
    if(!data.manuscript) data.manuscript = {chapters:[]};
    try{
      const chSnap = await chaptersCol(id).get();
      const bodies = {}; chSnap.forEach(c=> bodies[c.id]=c.data());
      (data.manuscript.chapters||[]).forEach(ch=>{
        const b=bodies[ch.id]; if(b){ ch.body=b.body||""; if(b.title) ch.title=b.title; } else { ch.body=ch.body||""; }
      });
    }catch(e){ console.warn("[Fabula] 章取得失敗 "+id+":", e); }
  }
  if(!state.currentId || !state.data[state.currentId]) state.currentId = state.projects[0]?.id || null;
  saveLocal();
}

function queueSync(id){
  if(!fbUser||!fbDb||!id) return;
  _syncSet.add(id);
  updateAuthChip("saving");
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(flushSync, 1000);
}
async function flushSync(){
  if(!fbUser||!fbDb) return;
  const ids=[..._syncSet]; _syncSet.clear();
  for(const id of ids){
    if(!state.data[id]) continue;             // 既に削除された作品は送らない
    const doc = serializeProject(id); if(!doc) continue;
    try{ await projectsCol().doc(id).set(doc); }
    catch(e){ console.warn("[Fabula] 同期失敗 "+id+":", e); }
  }
  updateAuthChip();
}
async function deleteRemote(id){
  if(!fbUser||!fbDb||!id) return;
  try{
    const chSnap = await chaptersCol(id).get();          // 章サブコレクションも一緒に削除
    await Promise.all(chSnap.docs.map(d=>d.ref.delete()));
    await projectsCol().doc(id).delete();
  }catch(e){ console.warn("[Fabula] リモート削除失敗:", e); }
}

// ---- 原稿の章ごと同期（本文は章ドキュメントに別保存） ----
let _chSyncTimer=null; const _chSyncSet=new Set();   // "pid::chId"
function queueChapterSync(pid, chId){
  if(!fbUser||!fbDb||!pid||!chId) return;
  _chSyncSet.add(pid+"::"+chId);
  updateAuthChip("saving");
  clearTimeout(_chSyncTimer);
  _chSyncTimer=setTimeout(flushChapterSync, 1000);
}
async function flushChapterSync(){
  if(!fbUser||!fbDb) return;
  const keys=[..._chSyncSet]; _chSyncSet.clear();
  for(const k of keys){
    const [pid,chId]=k.split("::");
    const data=state.data[pid]; if(!data) continue;
    const ch=(data.manuscript?.chapters||[]).find(c=>c.id===chId); if(!ch) continue;
    try{ await chaptersCol(pid).doc(chId).set({ title:ch.title||"", body:ch.body||"" }); }
    catch(e){ console.warn("[Fabula] 章同期失敗 "+k+":", e); }
  }
  updateAuthChip();
}
function deleteChapterRemote(pid, chId){
  if(!fbUser||!fbDb||!pid||!chId) return;
  chaptersCol(pid).doc(chId).delete().catch(e=>console.warn("[Fabula] 章削除失敗:", e));
}

function updateAuthChip(status){
  const chip=document.getElementById("authChip"); if(!chip) return;
  if(!fbAuth){ chip.style.display="none"; return; }   // SDK無し=ローカルモード（チップ非表示）
  chip.style.display="inline-flex";
  if(fbUser){
    const name=fbUser.displayName||fbUser.email||"ユーザー";
    const short=name.length>10?name.slice(0,10)+"…":name;
    chip.innerHTML=`<span class="sync-dot ${status==="saving"?"saving":""}"></span>${esc(short)}`;
    chip.title=(status==="saving"?"同期中… ":"☁ 同期済み ")+name;
    chip.onclick=openMenu;
  }else{
    chip.textContent="ログイン"; chip.title="Googleでログイン"; chip.onclick=login;
  }
}

// ============================ 起動（テーマはOSのライト/ダークに自動追従） ============================
document.getElementById("projSelect").onchange=e=>switchProject(e.target.value);
document.getElementById("newProjBtn").onclick=openProjectModal;
document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("searchBtn").onclick=openSearch;
document.getElementById("bookSettingsBtn").onclick=openBookSettings;
document.getElementById("bookPrintBtn").onclick=printBook;
document.getElementById("bookCloseBtn").onclick=closeBook;
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]"); if(!b)return;
  if(b.dataset.view===currentView) return;
  currentView=b.dataset.view; _tagFilter=null;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("active",x===b));
  renderView();
  animateMain();
});
if(!state.currentId && state.projects[0]) state.currentId=state.projects[0].id;
renderAll();
initFirebase();
</script>
